name: Publicar web del gimnasio

on:
  push:
    branches: [main]
    paths: ["gym-app/**", ".github/workflows/gym-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gym-web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir la web
        run: gym-app/build-web.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gym-app/web
      - id: deploy
        uses: actions/deploy-pages@v4
