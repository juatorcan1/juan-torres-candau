name: Publicar las webs (gimnasio y cuentas)

# Genera las dos webs y las sube a la rama gh-pages, que es la que publica GitHub Pages:
#   gimnasio (gym-app/build-web.sh)    -> https://juatorcan1.github.io/juan-torres-candau/
#   cuentas  (cuentas-app/build-web.sh) -> https://juatorcan1.github.io/juan-torres-candau/cuentas/
# gh-pages solo contiene las webs generadas: se reescribe entera en cada publicación,
# así que las dos se construyen siempre juntas.
on:
  push:
    branches: [main]
    paths: ["gym-app/**", "cuentas-app/**", ".github/workflows/gym-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gym-web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la web del gimnasio
        run: gym-app/build-web.sh
      - name: Construir la web de las cuentas
        run: |
          cuentas-app/build-web.sh
          mkdir -p gym-app/web/cuentas
          cp -r cuentas-app/web/. gym-app/web/cuentas/
      - name: Subir a gh-pages
        working-directory: gym-app/web
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Webs del gimnasio y de las cuentas desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
