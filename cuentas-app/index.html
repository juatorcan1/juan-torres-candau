<title>Las cuentas de Juan</title>
<meta name="description" content="Gastos, ingresos, cuentas, deudas, objetivos y previsión año a año hasta 2040, con escáner de tickets que reparte cada gasto en su categoría.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#D6DCE2; --line-2:#E5E9ED;
  --ink:#141B22; --ink-2:#404C58; --muted:#65717D;
  --acc:#233A8C; --acc-strong:#1C2F75; --acc-wash:rgba(35,58,140,.09);
  --ing:#1baf7a; --gas:#eb6834; --sal:#2a78d6; --prev:#8A96A3; --lastyear:#A3ADB8;
  --ok:#1D7F46; --warn:#9A6300; --over:#B8362B;
  --ok-bg:rgba(29,127,70,.10); --warn-bg:rgba(170,110,0,.12); --over-bg:rgba(184,54,43,.10);
  --focus:#233A8C;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101317; --surface:#1B1F24; --surface-2:#22272D; --line:#343B43; --line-2:#2A3037;
    --ink:#ECEFF2; --ink-2:#B9C1C9; --muted:#8B959F;
    --acc:#8CA2F0; --acc-strong:#3F57B8; --acc-wash:rgba(140,162,240,.14);
    --ing:#199e70; --gas:#d95926; --sal:#3987e5; --prev:#6C7784; --lastyear:#5D6873;
    --ok:#48B77A; --warn:#E0A53A; --over:#E6705F;
    --ok-bg:rgba(72,183,122,.14); --warn-bg:rgba(224,165,58,.14); --over-bg:rgba(230,112,95,.14);
    --focus:#8CA2F0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101317; --surface:#1B1F24; --surface-2:#22272D; --line:#343B43; --line-2:#2A3037;
  --ink:#ECEFF2; --ink-2:#B9C1C9; --muted:#8B959F;
  --acc:#8CA2F0; --acc-strong:#3F57B8; --acc-wash:rgba(140,162,240,.14);
  --ing:#199e70; --gas:#d95926; --sal:#3987e5; --prev:#6C7784; --lastyear:#5D6873;
  --ok:#48B77A; --warn:#E0A53A; --over:#E6705F;
  --ok-bg:rgba(72,183,122,.14); --warn-bg:rgba(224,165,58,.14); --over-bg:rgba(230,112,95,.14);
  --focus:#8CA2F0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* cabecera */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.strip-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-top:3px}
.year{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.year button{border:0;background:none;width:38px;height:38px;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.year button:disabled{opacity:.3;cursor:default}
.year b{font-family:var(--display);font-weight:800;font-size:20px;min-width:62px;text-align:center}
.year span{display:block;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:-2px}

main{padding-top:16px;display:grid;gap:16px;min-width:0}
main section{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.15}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-head p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);max-width:60ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.banner{font-size:14px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:11px 13px}
.banner b{color:var(--ink)}
.banner.warn{border-style:solid;border-color:transparent;background:var(--warn-bg);color:var(--ink)}
.empty{padding:22px 4px;text-align:center;color:var(--muted)}

/* cifras grandes */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;display:grid;gap:2px;align-content:start;min-width:0}
.tile .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,28px);line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* previsión */
.fore{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.fore div{display:grid;gap:1px}
.fore dt{font-size:12px;color:var(--muted);font-weight:600}
.fore dd{margin:0;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.fore .big dd{font-family:var(--display);font-weight:800;font-size:clamp(19px,5.2vw,26px);letter-spacing:-.02em;white-space:nowrap}
.why{margin:12px 0 0;font-size:13px;color:var(--ink-2);max-width:70ch}

/* pastillas */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.over{color:var(--over);background:var(--over-bg)}
.pill.neutral{color:var(--ink-2);background:var(--surface-2)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}

/* gráficos */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font:11px var(--body)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover,.chart .hit:focus{fill:var(--acc-wash);outline:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:7px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));z-index:5}
.tip .r{display:flex;align-items:center;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:0;border-top:2px solid;display:inline-block}
.legend .ln.dash{border-top-style:dashed}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.prev td{color:var(--muted);font-style:italic}

/* ranking por grupo */
.rank{display:grid;gap:2px}
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.rk:hover{background:var(--surface-2)}
.rk[aria-expanded="true"]{background:var(--surface-2)}
.rk .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.rk .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rk .am{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rk .bar{grid-column:1/-1;height:8px;background:var(--line-2);border-radius:4px;position:relative;overflow:hidden}
.rk .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.rk .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
.rk .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.drill{padding:6px 8px 14px;display:grid;gap:12px}
.subs{display:grid;gap:4px}
.sub{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line-2)}
.sub .p{color:var(--muted);font-size:12.5px;font-family:var(--mono)}

/* movimientos */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;max-width:100%;min-width:0}
.filters input[type=search]{flex:1 1 180px}
.day{margin-top:14px}
.day:first-child{margin-top:0}
.day h3{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--line)}
.mv{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:left}
.mv:hover{background:var(--surface-2)}
.mv .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.mv .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mv .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .d{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;text-align:right;white-space:nowrap}
.mv .a.in{color:var(--ok)}
.mv .a small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted)}
.flag{color:var(--warn);font-weight:700}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--acc-strong);border-color:var(--acc-strong);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--over);border-color:currentColor}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.subnav{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;padding:4px;overflow-x:auto;scrollbar-width:none}
.subnav button{flex:1 0 auto;border:0;background:none;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.subnav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* formularios */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label,.f .lab{font-size:12px;font-weight:700;color:var(--ink-2)}
.f label small{font-weight:500;color:var(--muted)}
.f.wide{grid-column:1/-1}
input,select,textarea{min-width:0}
.f input,.f select,.f textarea,.ln-row input,.ln-row select,.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px}
.f textarea,.inp.area{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.ln-row input:focus,.ln-row select:focus,.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.err{color:var(--over);font-size:14px;font-weight:600}

/* editor de movimiento */
.ed{display:grid;gap:14px}
.ed-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.thumb{width:84px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:block;cursor:zoom-in;padding:0;overflow:hidden}
.thumb img{display:block;width:100%;height:auto}
.lines{display:grid;gap:6px}
.ln-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) 104px 30px;gap:6px;align-items:center}
.ln-row.hd{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ln-row input.n{text-align:right;font-family:var(--mono)}
@media (max-width:560px){
  .ln-row{grid-template-columns:minmax(0,1fr) 96px 28px}
  .ln-row .c{grid-column:1/-1;order:3}
  .ln-row.hd .c{display:none}
  .ln-row{padding-bottom:8px;border-bottom:1px dashed var(--line-2)}
  .ln-row.hd{border:0;padding:0}
}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;border-radius:6px;padding:4px}
.x:hover{color:var(--over);background:var(--surface-2)}
.sumcheck{font-size:13.5px;padding:8px 10px;border-radius:8px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.sumcheck.ok{background:var(--ok-bg)} .sumcheck.bad{background:var(--warn-bg)}
.ed-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed-foot .sp{flex:1}
.ia-note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}

/* apuntar */
.ways{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ways button{display:grid;gap:4px;justify-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer}
.ways button b{font-size:15px}
.ways button span{font-size:12.5px;color:var(--muted)}
.ways button svg{width:26px;height:26px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ways button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--acc-wash)}
@media (max-width:700px){.ways{grid-template-columns:repeat(2,minmax(0,1fr))}}
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:26px 16px;background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--acc-wash)}
.drop b{font-size:16px}
.job{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:12px}
.job-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.thinking{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ext{display:grid;gap:0}
.ext-row{display:grid;grid-template-columns:28px 78px minmax(0,1fr) minmax(0,190px) 96px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.ext-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.ext-row .c select{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 6px;font-size:13px}
.ext-row .a{text-align:right;font-family:var(--mono)}
.ext-row .dup{grid-column:2/-1;font-size:12px;color:var(--warn)}
.ext-row.off{opacity:.55}
@media (max-width:620px){.ext-row{grid-template-columns:26px 64px minmax(0,1fr) 84px}.ext-row .c{grid-column:2/-1;order:5}}

/* cuentas */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.acc{border:1px solid var(--line-2);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px;align-content:start}
.acc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.acc-h b{font-size:16px}
.acc .bal{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.acc .bal.neg{color:var(--over)}
.acc .meta{font-size:12.5px;color:var(--ink-2)}
.spark{width:100%;height:36px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* objetivos */
.goals{display:grid;gap:12px}
.goal{border:1px solid var(--line-2);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.goal-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.goal-h b{font-size:16px}
.prog{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sal);border-radius:6px}
.goal.done .prog i{background:var(--ok)}
.goal .k{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.goal .k b{font-family:var(--mono);color:var(--ink);font-weight:500}

/* fijos */
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.rec .n{font-weight:600}
.rec .m{font-size:12.5px;color:var(--muted)}
.rec .a{font-family:var(--mono);text-align:right}

/* hoja emergente */
.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45)}
.sheet{position:fixed;z-index:71;left:0;right:0;bottom:0;margin-inline:auto;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);display:grid;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:20px}
.zoom{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}

/* pregúntale */
.ask{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.ask textarea{min-height:48px}
.answer{white-space:pre-wrap;font-size:15px;line-height:1.55;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sugg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}

/* primeros pasos */
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;counter-increment:s;padding:10px;border-radius:10px;background:var(--surface-2)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--acc-strong);color:#fff}
.steps li.done::before{content:"✓";background:var(--ok)}
.steps li b{display:block}
.steps li span{font-size:13px;color:var(--ink-2)}

/* navegación inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;border-radius:10px}
.bnav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav button[aria-current="page"] svg{stroke:var(--acc)}
.bnav button span{line-height:1.15;text-align:center}
/* botón redondo para apuntar, siempre a mano encima de la barra */
.fab{position:fixed;z-index:45;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc-strong);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.fab[aria-current="page"]{outline:3px solid var(--acc-wash);outline-offset:2px}
@media (min-width:1040px){.fab{right:calc(50% - 490px)}}
tr.grp td{font-weight:700;background:var(--surface-2)}
tr.subrow td{font-size:13px;color:var(--ink-2)}
tr.subrow td:first-child{padding-left:22px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px;z-index:95;max-width:calc(100% - 32px)}

/* a medias */
.split-in{display:grid;gap:14px}
.split-lines{display:grid;gap:8px;margin-top:12px}
.sl{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;display:grid;gap:8px}
.sl.nobody{border-color:var(--warn);background:var(--warn-bg)}
.sl-top{display:grid;grid-template-columns:minmax(0,1fr) 92px 32px;gap:6px;align-items:center}
.sl-top input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);min-width:0}
.sl-top input.n{text-align:right;font-family:var(--mono)}
.chips.sm button{padding:4px 10px;font-size:13px}
.split-tot{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:14px}
.split-tot .tile{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.tc-bal{display:grid;gap:8px;margin-top:12px}
.tc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.tc-row .am{font-family:var(--mono);font-weight:600}
.tc-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.tc-row .bar i{display:block;height:100%;border-radius:3px}
.mes-band{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px -8px 10px;padding:10px 12px;border-radius:10px;background:var(--acc-wash);border-left:4px solid var(--acc)}
.mes-band:first-child{margin-top:0}
.mes-band b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
.mes-band span{font-size:14px;font-weight:600;color:var(--ink-2)}
.mes-band + .day{margin-top:6px}
.ia-ask{font-size:14px;color:var(--ink);background:var(--acc-wash);border:1px solid var(--acc);border-radius:10px;padding:10px 12px}
.ia-ask .chips button small{font-weight:500}
/* cámara propia */
.cam{position:fixed;inset:0;z-index:90;background:#000;display:grid;grid-template-rows:1fr auto}
.cam video{width:100%;height:100%;object-fit:cover;min-height:0}
.cam-msg{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));background:#000}
.cam-btn{background:none;border:0;color:#fff;font:inherit;font-weight:600;font-size:15px;padding:10px;cursor:pointer}
.cam-btn[data-cam="luz"]{justify-self:end}.cam-btn[data-cam="x"]{justify-self:start}
.cam-btn[aria-pressed="true"]{color:#ffd54a}
.cam-shot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 3px #000;cursor:pointer}
.cam-shot:disabled{opacity:.5}
.day h3.dia{justify-content:flex-start}
.dia-tot{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-2);margin-left:4px}
.tc-pasar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 4px;padding:12px 14px;border-radius:10px;background:var(--acc-wash)}
.tc-pasar > div{display:grid;gap:2px;min-width:0}
</style>

<script>
(function(){
"use strict";

/* ===== 01-core.js ===== */
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const num = v => { if (typeof v === "number") return isFinite(v) ? v : 0; let s = String(v ?? "").trim().replace(/\s|€/g, ""); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
const NF2 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 0 });
const eur = v => NF2.format(r2(v || 0)) + " €";
const eur0 = v => NF0.format(Math.round(v || 0)) + " €";
const pct = v => NF0.format(Math.round(v || 0)) + " %";
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const TODAY = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const shortDate = iso => { const d = parseISO(iso); return `${d.getDate()} ${MES[d.getMonth()]}`; };
const longDate = iso => { const d = parseISO(iso); return `${cap(DIA[d.getDay()])} ${d.getDate()} de ${MESL[d.getMonth()]}`; };
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

/* ================= categorías por defecto ================= */
// La caza, aparte: cartuchos, licencias, coto, armero… (se añade también a las categorías ya guardadas)
// Las bodas a las que va Juan, todas juntas: el regalo, la ropa, el viaje, las despedidas…
const BODAS = [["regalo","Regalo o sobre a los novios"],["ropa","Traje, vestido y complementos"],["viaje","Viaje y alojamiento"],["despedidas","Despedidas de soltero"],["estetica","Peluquería y estética"]];
const CAZA = [["cartuchos","Cartuchos y munición"],["licencias","Licencias, permisos y seguro"],["coto","Coto, cuotas y monterías"],["armas","Armas, armero y revisiones"],["equipo","Ropa y equipo de caza"],["perros","Perros de caza"],["viajes","Viajes y comidas de caza"]];
const DEF_CATS = {
  gasto: [
    { id: "casa", nombre: "Casa", cats: [["hipoteca","Hipoteca o alquiler"],["comunidad","Comunidad"],["ibi","IBI y basuras"],["luz","Luz"],["agua","Agua"],["gas","Gas"],["internet","Internet y móvil"],["seguro","Seguro de hogar"],["arreglos","Arreglos y mantenimiento"],["hogar","Muebles y cosas de casa"],["limpieza","Limpieza y droguería"]] },
    { id: "comida", nombre: "Comida", cats: [["super","Supermercado"],["mercado","Fruta, carne y pescado"],["panaderia","Panadería y cafés"]] },
    { id: "fuera", nombre: "Comer fuera y ocio", cats: [["restaurantes","Restaurantes"],["bares","Bares y copas"],["ocio","Ocio y espectáculos"],["viajes","Viajes y vacaciones"]] },
    { id: "coche", nombre: "Coche y transporte", cats: [["gasolina","Gasolina"],["taller","Taller e ITV"],["seguro","Seguro del coche"],["parking","Parking y peajes"],["impuesto","Impuesto de circulación"],["multas","Multas (tráfico y zona azul)"],["transporte","Taxi, tren y avión"]] },
    { id: "salud", nombre: "Salud y deporte", cats: [["medico","Médico y dentista"],["farmacia","Farmacia"],["deporte","Gimnasio y deporte"],["seguro","Seguro médico"]] },
    { id: "caza", nombre: "Caza", cats: CAZA },
    { id: "bodas", nombre: "Bodas", cats: BODAS },
    { id: "personal", nombre: "Ropa y cuidado", cats: [["ropa","Ropa y calzado"],["peluqueria","Peluquería y cuidado"]] },
    { id: "familia", nombre: "Familia", cats: [["colegio","Colegio y formación"],["actividades","Actividades de los niños"],["mascotas","Mascotas"],["ayudas","Ayudas a la familia"]] },
    { id: "compras", nombre: "Compras", cats: [["tecnologia","Tecnología"],["regalos","Regalos"],["internet","Compras por internet"],["otras","Otras compras"]] },
    { id: "suscr", nombre: "Suscripciones", cats: [["apps","Series, música y apps"],["cuotas","Cuotas y asociaciones"]] },
    { id: "finanzas", nombre: "Impuestos y banco", cats: [["irpf","IRPF y Hacienda"],["comisiones","Comisiones del banco"],["intereses","Intereses de préstamos y tarjetas"],["prestamos","Otros pagos de préstamos"],["seguros","Seguros de vida"]] },
    { id: "otros", nombre: "Otros gastos", cats: [["varios","Varios"],["efectivo","Efectivo sin justificar"]] }
  ],
  ingreso: [
    { id: "trabajo", nombre: "Trabajo", cats: [["nomina","Nómina"],["extra","Pagas extra y bonus"],["honorarios","Honorarios y facturas"]] },
    { id: "empresa", nombre: "Empresa", cats: [["dividendos","Dividendos"],["socio","Retribución de socio"]] },
    { id: "rentas", nombre: "Rentas", cats: [["alquileres","Alquileres"],["intereses","Intereses de depósitos"],["inversiones","Rendimientos de inversiones"]] },
    { id: "otrosi", nombre: "Otros ingresos", cats: [["hacienda","Devolución de Hacienda"],["ventas","Venta de cosas"],["regalos","Regalos recibidos"],["reembolsos","Reembolsos y devoluciones"],["varios","Varios"]] }
  ]
};
const ACC_TYPES = { banco: "Cuenta de banco", efectivo: "Efectivo", deposito: "Depósito a plazo", inversion: "Inversión", ahorro: "Cuenta de ahorro", prestamo: "Préstamo o hipoteca", credito: "Tarjeta de crédito", prestado: "Cuenta con una persona (lo que te debe o le debes)" };
const DEBT = t => t === "prestamo" || t === "credito";
// Deudores: cada persona que te debe dinero es una "cuenta" con saldo a tu favor. Prestar es pasar
// dinero de tu banco a esa cuenta, y que te devuelva es pasarlo de vuelta. No cuenta como dinero tuyo
// disponible (ni en «Dinero hoy» ni en la previsión) hasta que te lo devuelven.
const LENT = t => t === "prestado";
const BANKS = ["Santander","BBVA","CaixaBank","Sabadell","Unicaja","Cajasur","Bankinter","ING","Openbank","Kutxabank","Abanca","Ibercaja","Cajamar","Revolut","MyInvestor","Trade Republic"];
const EVERY = { 1: "cada mes", 2: "cada dos meses", 3: "cada trimestre", 6: "cada seis meses", 12: "una vez al año" };

/* ================= estado ================= */
// WEB = la web suelta (GitHub Pages + Supabase, con usuario y contraseña); si no, el Artifact de Claude.
const WEB = !!window.CJ_WEB;
let db = null, sample = null, assets = null, imgCaps = null;
// Dirección de la foto de un ticket: en Claude sale directa; en la web se pide un enlace
// temporal a la carpeta privada y se repinta cuando llega.
const TK = {};
function ticketSrc(id, onReady){
  if (!id) return "";
  if (!WEB) return "/_blob/" + id;
  if (TK[id]) return TK[id] === "…" ? "" : TK[id];
  TK[id] = "…";
  if (assets && assets.signedUrl) assets.signedUrl(id).then(u => { TK[id] = u || ""; if (u && onReady) onReady(); }).catch(() => { delete TK[id]; });
  else delete TK[id];
  return "";
}
let dbState = "loading";           // loading | ready | none
let meses = {};                    // "2026-09" -> doc data
let cfg = { cuentas: null, cats: null, prefs: {}, tricount: [] };
let anios = {};                    // "2026" -> {recurrentes, presupuesto, objetivos}
let MOVS = [];                     // todos los movimientos, más nuevos primero
const NOW = TODAY();
const CUR_Y = NOW.getFullYear();
const MAX_Y = Math.max(2040, CUR_Y + 1);   // hasta dónde se puede mirar
let Y = Math.min(MAX_Y, Math.max(CUR_Y - 15, parseInt(store.get("cj.year", CUR_Y)) || CUR_Y));
let tab = store.get("cj.tab", "anio");

// Las categorías guardadas antes de existir las deudas no traen la de intereses: se añade al vuelo.
let _catsSrc = null, _catsOut = null;
function cats(){
  const src = cfg.cats || DEF_CATS;
  if (src !== _catsSrc) {
    _catsSrc = src;
    const c = JSON.parse(JSON.stringify(src));
    const f = c.gasto.find(g => g.id === "finanzas");
    if (!f) c.gasto.push({ id: "finanzas", nombre: "Impuestos y banco", cats: [["intereses", "Intereses de préstamos y tarjetas"]] });
    else if (!f.cats.some(x => x[0] === "intereses")) f.cats.unshift(["intereses", "Intereses de préstamos y tarjetas"]);
    // la caza, si las categorías se guardaron antes de que existiera
    if (!c.gasto.some(g => g.id === "caza")) { const i = c.gasto.findIndex(g => g.id === "personal"); c.gasto.splice(i >= 0 ? i : c.gasto.length, 0, { id: "caza", nombre: "Caza", cats: CAZA.map(x => x.slice()) }); }
    if (!c.gasto.some(g => g.id === "bodas")) { const i = c.gasto.findIndex(g => g.id === "personal"); c.gasto.splice(i >= 0 ? i : c.gasto.length, 0, { id: "bodas", nombre: "Bodas", cats: BODAS.map(x => x.slice()) }); }
    // las multas, si las categorías se guardaron antes de que existieran
    const co = c.gasto.find(g => g.id === "coche");
    if (co && !co.cats.some(x => x[0] === "multas")) co.cats.push(["multas", "Multas (tráfico y zona azul)"]);
    // y la de lo prestado que no vuelve, para cuando un deudor no paga
    const o = c.gasto.find(g => g.id === "otros");
    if (!o) c.gasto.push({ id: "otros", nombre: "Otros gastos", cats: [["perdido", "Dinero prestado que no vuelve"]] });
    else if (!o.cats.some(x => x[0] === "perdido")) o.cats.push(["perdido", "Dinero prestado que no vuelve"]);
    _catsOut = c;
  }
  return _catsOut;
}
function cuentas(){ return (cfg.cuentas && cfg.cuentas.length ? cfg.cuentas : [{ id: "efectivo", nombre: "Efectivo", tipo: "efectivo", entidad: "", ancla: null }]).filter(c => c && !c.borrada); }
function cuenta(id){ return cuentas().find(c => c.id === id) || null; }
// Subida de precios al año que se aplica a los gastos de los años que vienen (Juan la puede cambiar)
const subida = () => { const v = cfg.prefs && cfg.prefs.subida; return v == null || v === "" ? 3 : num(v); };
// Los fijos de un año que viene sin fijos propios son los del último año que los tenga
function recsFor(y){
  const own = anio(y).recurrentes;
  if (own.length || y <= CUR_Y) return { list: own, from: y };
  for (let k = y - 1; k >= CUR_Y - 1; k--) { const l = anio(k).recurrentes; if (l.length) return { list: l, from: k }; }
  return { list: [], from: y };
}

/* ================= movimientos ================= */
// Un movimiento: {id, fecha, tipo gasto|ingreso|traspaso, cuenta, destino, comercio, nota, total, lineas[{concepto,cat,importe}], origen, ticket, revisar, creado, banco,

function cleanMov(m){
  const tipo = ["gasto","ingreso","traspaso"].includes(m.tipo) ? m.tipo : "gasto";
  const lineas = tipo === "traspaso" ? [] : (m.lineas || []).filter(l => l && (num(l.importe) || l.concepto)).map(l => ({ concepto: String(l.concepto || "").slice(0, 120), cat: l.cat || "", importe: r2(num(l.importe)) }));

    id: m.id || uid(), fecha: m.fecha, tipo, cuenta: m.cuenta || "", destino: tipo === "traspaso" ? (m.destino || "") : "",
    comercio: String(m.comercio || "").slice(0, 80), nota: String(m.nota || "").slice(0, 400),
    total: r2(Math.abs(num(m.total))), lineas, origen: m.origen || "mano", ticket: m.ticket || null,
    revisar: !!m.revisar, creado: m.creado || Date.now(), banco: m.banco || null, deuda: m.deuda || null,

function rebuild(){

  all.sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.creado || 0) - (a.creado || 0));

// Reparto de un movimiento por categoría; lo que no cuadra con el total va a "sin categoría".

  for (const l of m.lineas || []) { const v = num(l.importe); if (!v) continue; out.push({ cat: CATIDX[l.cat] ? l.cat : "", v }); s += v; }
  const rest = r2(num(m.total) - s);

}
// Efecto de un movimiento en una cuenta
function eff(m, cid){
  const t = num(m.total);

  if (m.tipo === "ingreso") return m.cuenta === cid ? t : 0;

// Saldo de una cuenta al final del día `iso`. El ancla es el saldo que Juan dijo en una fecha.
function saldo(c, iso){
  const a = c.ancla || { fecha: "1900-01-01", saldo: 0, ts: 0 };
  const after = m => m.fecha > a.fecha || (m.fecha === a.fecha && (m.creado || 0) > (a.ts || 0));

}

const debe = (c, iso) => Math.max(0, -saldo(c, iso));

const teDebe = (c, iso) => Math.max(0, saldo(c, iso));

// Cuándo acabas de pagar un préstamo al ritmo de su cuota
function finPrestamo(c){

/* ================= números del año ================= */
let STATS = {};
function yearStats(y){

    st.n++; if (m.revisar) st.revisar++;
    if (!st.lastDate || m.fecha > st.lastDate) st.lastDate = m.fecha;
    if (m.tipo === "traspaso") continue;
    const mo = parseISO(m.fecha).getMonth();
    const t = num(m.total);
    if (m.tipo === "gasto") { st.gas[mo] += t; st.G += t; } else { st.ing[mo] += t; st.I += t; }
    for (const sp of splits(m)) {
      const ck = sp.cat || "_sin";
      const bc = st.byCat[m.tipo]; bc[ck] = (bc[ck] || 0) + sp.v;

function yearPhase(y){ return y < CUR_Y ? "pasado" : y > CUR_Y ? "futuro" : "actual"; }

// Ocurrencias de un fijo en un mes (0-11) del año
function recHits(r, mo){
  const every = Math.max(1, parseInt(r.cada) || 1);
  const start = Math.min(12, Math.max(1, parseInt(r.mes) || 1)) - 1;
  const end = r.hasta ? Math.min(12, Math.max(1, parseInt(r.hasta))) - 1 : 11;
  if (mo < start || mo > end) return false;

// La previsión: lo real hasta hoy + lo fijo que queda + la media de lo variable, categoría a categoría.

  const recs = rf.list.filter(r => rf.from === y || !r.hasta).map(r => r.tipo === "ingreso" || rf.from === y ? r : { ...r, importe: num(r.importe) * upG(y - rf.from) });

  // meses de referencia para la media: los 3 anteriores al mes en curso, desde que empezaste a apuntar.

  const ref = phase === "actual" ? new Date(y, NOW.getMonth(), 1) : new Date(CUR_Y, NOW.getMonth(), 1);
  const back = [];
  for (let k = 1; k <= 3; k++) { const d = new Date(ref.getFullYear(), ref.getMonth() - k, 1); back.push([d.getFullYear(), d.getMonth()]); }
  const primero = MOVS.length ? MOVS[MOVS.length - 1].fecha.slice(0, 7) : null;
  const withData = primero ? back.filter(([yy, mo]) => `${yy}-${pad(mo + 1)}` >= primero) : [];
  const varBase = withData.length ? `la media de ${withData.length === 1 ? "el último mes" : "los últimos " + withData.length + " meses"}` : (phase === "actual" ? "lo que llevas este mes, estirado al mes entero" : "");

  const ing = st.ing.slice(), gas = st.gas.slice();
  const pIng = Array(12).fill(0), pGas = Array(12).fill(0), pCap = Array(12).fill(0);
  const hayPrestamo = cuentas().some(c => c.tipo === "prestamo" && c.ancla && num(c.cuota) > 0);
  const catPrev = { gasto: {}, ingreso: {} };
  let varAvg = 0;
  if (phase !== "pasado") {
    for (const tipo of ["gasto", "ingreso"]) {
      const P = tipo === "gasto" ? pGas : pIng;
      const keys = new Set(Object.keys(CATIDX).filter(k => CATIDX[k].tipo === tipo)); keys.add("_sin");
      const recT = recs.filter(r => (r.tipo === "ingreso" ? "ingreso" : "gasto") === tipo);
      for (const cat of keys) {

// Previsión de fin de año de un grupo de categorías (para el presupuesto)
function groupForecast(y, tipo, gid){

  let prev = 0;
  for (const [cat, v] of Object.entries(f.catPrev[tipo])) if ((cat === "_sin" ? "_sin" : catGroup(cat)) === gid) prev += v;

// Ahorro medio al mes de los últimos meses con datos (para los objetivos)
function ahorroMedio(){
  const out = [];
  for (let k = 1; k <= 6; k++) {
    const d = new Date(NOW.getFullYear(), NOW.getMonth() - k, 1);
    const key = d.getFullYear() + "-" + pad(d.getMonth() + 1);

/* ================= gráficos ================= */
// Escala "bonita" para el eje
function niceMax(v){
  if (v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const k of [1, 1.2, 1.6, 2, 2.4, 3, 4, 6, 8, 10]) if (k * p >= v) return k * p;   // divisibles en cuartos redondos
  return 10 * p;
}
const NF1 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 1 });
const axisLab = v => Math.abs(v) >= 10000 ? NF1.format(v / 1000) + " mil" : NF0.format(v);
function tipShow(wrap, x, y, html){
  let t = wrap.querySelector(".tip");
  if (!t) { t = document.createElement("div"); t.className = "tip"; wrap.appendChild(t); }
  t.innerHTML = html; t.hidden = false;
  const w = wrap.clientWidth;
  t.style.left = Math.min(Math.max(x, 80), w - 80) + "px"; t.style.top = y + "px";
}
function tipHide(wrap){ const t = wrap.querySelector(".tip"); if (t) t.hidden = true; }
function bindTips(wrap, svg, W, rows){
  wrap.querySelectorAll(".hit").forEach(h => {
    const i = +h.dataset.i;
    const show = () => { const r = svg.getBoundingClientRect(), k = r.width / W; tipShow(wrap, (+h.dataset.cx) * k, (+h.dataset.ty) * k, rows(i)); };
    h.addEventListener("pointerenter", show); h.addEventListener("focus", show);

  });

// Barras por mes, varias series lado a lado; cada serie con parte real y parte prevista.
// series: [{label, color, real[12], prev[12]}]
function monthBars(el, series, opts = {}){
  const W = Math.round(Math.max(340, Math.min(720, el.clientWidth || 640))), H = opts.h || 230, L = 46, R = 8, T = 12, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const tot = i => series.map(s => (s.real[i] || 0) + ((s.prev || [])[i] || 0));
  const max = niceMax(Math.max(1, ...Array.from({ length: 12 }, (_, i) => Math.max(...tot(i)))));
  const cw = pw / 12, gap = 2, bw = Math.max(3, Math.min(18, (cw - (cw < 30 ? 4 : 10)) / series.length - gap));
  const yv = v => T + ph - v / max * ph;
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = yv(v); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 4}" text-anchor="end">${axisLab(v)}</text>`; }
  let bars = "", hits = "";
  for (let i = 0; i < 12; i++) {
    const x0 = L + i * cw + (cw - (bw + gap) * series.length + gap) / 2;
    series.forEach((s, j) => {
      const x = x0 + j * (bw + gap), rv = Math.max(0, s.real[i] || 0), pv = Math.max(0, (s.prev || [])[i] || 0);
      const yR = yv(rv), hR = T + ph - yR;
      if (pv > 0) { const yP = yv(rv + pv); bars += `<path d="${roundTop(x, yP, bw, yR - yP + (rv > 0 ? 0 : 0))}" style="fill:${s.color};fill-opacity:.22;stroke:${s.color}" stroke-dasharray="3 2" stroke-width="1.2"/>`; }
      if (rv > 0) bars += `<path d="${pv > 0 ? rect(x, yR, bw, hR) : roundTop(x, yR, bw, hR)}" style="fill:${s.color}"/>`;
    });
    const top = Math.min(...series.map(s => yv((s.real[i] || 0) + ((s.prev || [])[i] || 0))));
    hits += `<rect class="hit" tabindex="0" data-i="${i}" data-cx="${L + i * cw + cw / 2}" data-ty="${top}" x="${L + i * cw}" y="${T}" width="${cw}" height="${ph}" aria-label="${MESL[i]}"/>`;
    g += `<text class="axis" x="${L + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${W < 460 ? MES[i][0].toUpperCase() : MES[i]}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Por meses")}">${g}<line class="base" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>${bars}${hits}</svg>`;
  bindTips(el, el.querySelector("svg"), W, i => `<b>${cap(MESL[i])}</b>` + series.map(s => {
    const rv = s.real[i] || 0, pv = (s.prev || [])[i] || 0;
    return `<div class="r"><span class="sw" style="background:${s.color}"></span>${esc(s.label)}: ${eur(rv + pv)}${pv > 0.005 ? ` <span style="opacity:.7">(${rv > 0.005 ? eur(pv) + " previsto" : "previsto"})</span>` : ""}</div>`;
  }).join(""));
}
function rect(x, y, w, h){ return `M${x},${y}h${w}v${h}h${-w}z`; }
function roundTop(x, y, w, h){ const r = Math.min(4, w / 2, h); if (h <= 0) return ""; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}z`; }

// Líneas por mes. series: [{label, color, values[12] (null = sin dato), dashFrom (índice desde el que es previsión), dash}]
function monthLines(el, series, opts = {}){
  const W = Math.round(Math.max(340, Math.min(720, el.clientWidth || 640))), H = opts.h || 220, L = 52, R = 12, T = 14, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const N = series[0].values.length, LAB = opts.labels || MES, TIPL = opts.tipLabels || MESL.map(cap);
  const vals = series.flatMap(s => s.values.filter(v => v != null));
  let lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  hi = niceMax(hi); if (lo < 0) lo = -niceMax(-lo);
  const xv = i => L + (i + .5) * pw / N, yv = v => T + ph - (v - lo) / (hi - lo) * ph;
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = yv(v); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 4}" text-anchor="end">${axisLab(v)}</text>`; }
  if (lo < 0) g += `<line class="base" x1="${L}" x2="${W - R}" y1="${yv(0)}" y2="${yv(0)}"/>`;
  const step = N > 12 ? (W < 460 ? 3 : 2) : 1;
  for (let i = 0; i < N; i++) if (i % step === 0 || i === N - 1) g += `<text class="axis" x="${xv(i)}" y="${H - 8}" text-anchor="middle">${N <= 12 && W < 460 ? String(LAB[i])[0].toUpperCase() : LAB[i]}</text>`;
  let paths = "";
  for (const s of series) {
    const pts = s.values.map((v, i) => v == null ? null : [xv(i), yv(v)]);
    const seg = (from, to) => { let d = "", on = false; for (let i = from; i <= to; i++) { const p = pts[i]; if (!p) { on = false; continue; } d += (on ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); on = true; } return d; };
    const df = s.dashFrom == null ? N : s.dashFrom;
    const solid = df > 0 ? seg(0, Math.min(N - 1, df - 1)) : "", dashed = df < N ? seg(Math.max(0, df - 1), N - 1) : "";
    if (s.area && solid) { const idx = pts.map((p, i) => p && i < df ? i : -1).filter(i => i >= 0); if (idx.length > 1) paths += `<path d="${solid}L${xv(idx[idx.length - 1])},${yv(Math.max(lo, 0))}L${xv(idx[0])},${yv(Math.max(lo, 0))}z" style="fill:${s.color};fill-opacity:.10"/>`; }
    if (s.dash) { if (solid || dashed) paths += `<path d="${seg(0, N - 1)}" style="fill:none;stroke:${s.color}" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>`; }
    else {
      if (solid) paths += `<path d="${solid}" style="fill:none;stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (dashed) paths += `<path d="${dashed}" style="fill:none;stroke:${s.color}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
    }
    const lastI = pts.reduce((a, p, i) => p ? i : a, -1);
    if (lastI >= 0 && s.endDot !== false) paths += `<circle cx="${pts[lastI][0]}" cy="${pts[lastI][1]}" r="4" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
  }
  let hits = "";
  for (let i = 0; i < N; i++) { const tops = series.map(s => s.values[i]).filter(v => v != null); hits += `<rect class="hit" tabindex="0" data-i="${i}" data-cx="${xv(i)}" data-ty="${tops.length ? yv(Math.max(...tops)) : T + ph / 2}" x="${L + i * pw / N}" y="${T}" width="${pw / N}" height="${ph}" aria-label="${esc(TIPL[i])}"/>`; }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Evolución")}">${g}${paths}${hits}</svg>`;
  bindTips(el, el.querySelector("svg"), W, i => `<b>${esc(TIPL[i])}</b>` + series.filter(s => s.values[i] != null).map(s => `<div class="r"><span class="sw" style="background:${s.color}"></span>${esc(s.label)}: ${eur(s.values[i])}${s.dashFrom != null && i >= s.dashFrom ? " <span style='opacity:.7'>(previsto)</span>" : ""}</div>`).join(""));
}
function sparkline(values, color){
  const v = values.filter(x => x != null); if (v.length < 2) return "";
  const W = 200, H = 36, lo = Math.min(...v), hi = Math.max(...v), rg = hi - lo || 1;
  const pts = values.map((x, i) => x == null ? null : [i * W / (values.length - 1), H - 3 - (x - lo) / rg * (H - 6)]).filter(Boolean);
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="-4 0 ${W + 8} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="M${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L")}" style="fill:none;stroke:${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" style="fill:${color}"/></svg>`;
}

Sus datos (JSON):
${JSON.stringify(resumenParaIA())}`;

let anTipo = store.get("cj.antipo", "gasto"), anOpen = null;
function renderAnalisis(){
  const el = $("#v-analisis");
  const st = yearStats(Y), f = forecast(Y), prev = yearStats(Y - 1);
  const t = anTipo, pres = anio(Y).presupuesto;
  const tot = t === "gasto" ? st.G : st.I;
  const ids = new Set([...Object.keys(st.byGroupMonth[t]), ...(t === "gasto" ? Object.keys(pres).filter(k => num(pres[k]) > 0) : [])]);
  const rows = [...ids].map(g => { const gf = groupForecast(Y, t, g); return { g, real: gf.real, fin: gf.fin, pres: t === "gasto" ? num(pres[g]) : 0, ant: prev.byGroupMonth[t][g] ? sum(prev.byGroupMonth[t][g]) : 0 }; })
    .filter(r => r.real > 0.005 || r.pres > 0 || r.fin > 0.005).sort((a, b) => b.real - a.real || b.fin - a.fin);
  const mx = Math.max(1, ...rows.map(r => Math.max(r.real, r.fin, r.pres)));
  const col = t === "gasto" ? "var(--gas)" : "var(--ing)";
  let h = `<div class="panel"><div class="panel-head"><div><h2>${t === "gasto" ? "En qué se va el dinero" : "De dónde viene el dinero"}</h2><p>${Y}: ${eur(tot)} ${t === "gasto" ? "gastados" : "ingresados"}${f.phase !== "pasado" ? ` · a fin de año, unos ${eur(t === "gasto" ? f.G : f.I)}` : ""}. Toca un grupo para ver el detalle.</p></div>
    <div class="seg" role="group" aria-label="Qué mirar"><button type="button" data-antipo="gasto" aria-pressed="${t === "gasto"}">Gastos</button><button type="button" data-antipo="ingreso" aria-pressed="${t === "ingreso"}">Ingresos</button></div></div>`;
  if (!rows.length) h += `<p class="empty">No hay ${t === "gasto" ? "gastos" : "ingresos"} apuntados en ${Y}.</p>`;
  h += `<div class="rank">`;
  for (const r of rows) {
    let pill = "";
    if (r.pres > 0) {
      const ratio = r.fin / r.pres;
      pill = ratio > 1.0001 ? `<span class="pill over">Te pasas ${eur(r.fin - r.pres)}</span>` : ratio > 0.9 ? `<span class="pill warn">Justo: te sobran ${eur(r.pres - r.fin)}</span>` : `<span class="pill ok">Bien: te sobran ${eur(r.pres - r.fin)}</span>`;
    }
    const open = anOpen === t + ":" + r.g;
    h += `<button type="button" class="rk" data-grp="${t}:${r.g}" aria-expanded="${open}"><span class="nm">${esc(groupName(t, r.g))}<small>${tot > 0 ? pct(r.real / tot * 100) : ""}</small></span><span class="am">${eur(r.real)}</span>
      <span class="bar"><i style="width:${(r.fin / mx * 100).toFixed(1)}%;background:${col};opacity:.25"></i><i style="width:${(r.real / mx * 100).toFixed(1)}%;background:${col}"></i>${r.pres > 0 ? `<u style="left:calc(${(r.pres / mx * 100).toFixed(1)}% - 1px)" title="Presupuesto"></u>` : ""}</span>
      <span class="meta">${f.phase !== "pasado" && r.fin - r.real > 0.5 ? `<span>a fin de año ${eur(r.fin)}</span>` : ""}${r.pres > 0 ? `<span>presupuesto ${eur(r.pres)}</span>` : ""}${r.ant > 0 ? `<span>${Y - 1}: ${eur(r.ant)}</span>` : ""}${pill}</span></button>`;
    if (open) h += `<div class="drill" id="drill"></div>`;
  }
  h += `</div>`;
  if (rows.length) h += `<div class="legend"><span><span class="sw" style="background:${col}"></span>Llevas</span>${f.phase !== "pasado" ? `<span><span class="sw" style="background:${col};opacity:.25"></span>Previsto a fin de año</span>` : ""}${t === "gasto" && Object.keys(pres).length ? `<span><span class="ln" style="border-top:0;border-left:2px solid var(--ink);height:12px;width:0"></span>Presupuesto</span>` : ""}</div>`;
  h += `</div>`;

  // curva acumulada
  const acc = a => { let s = 0; return a.map(v => (s += v)); };

  const cumShown = cum.map((v, i) => (f.phase === "futuro" || i <= 11) ? v : null);

  const hasPrev = prev.n > 0;
  h += `<div class="panel"><div class="panel-head"><div><h2>La curva del año</h2><p>${t === "gasto" ? "Gasto" : "Ingreso"} acumulado mes a mes${hasPrev ? `, frente a ${Y - 1}` : ""}.</p></div></div><div class="chart" id="ch-cum"></div>
    <div class="legend"><span><span class="ln" style="border-color:${col}"></span>${Y}</span>${f.phase !== "pasado" ? `<span><span class="ln dash" style="border-color:${col}"></span>Previsto</span>` : ""}${hasPrev ? `<span><span class="ln" style="border-color:var(--lastyear)"></span>${Y - 1}</span>` : ""}</div></div>`;
  el.innerHTML = h;

    if (el.dataset.lk === "cat" && d.pregunta && +el.dataset.li === d.pregunta.linea) d.pregunta = null;   // elegida a mano: ya está contestada
  }
}
function repaintEditor(key){
  const box = document.querySelector(`.ed[data-ed="${key}"]`); if (!box) return;
  const wrap = document.createElement("div"); wrap.innerHTML = editorHTML(key);
  box.replaceWith(wrap.firstElementChild); paintSum(key);

// Borrador -> movimiento listo para guardar (o un error en palabras llanas)
function draftToMov(d){
  if (!d.fecha || !/^\d{4}-\d{2}-\d{2}$/.test(d.fecha)) return { err: "Falta la fecha." };
  let total = r2(Math.abs(num(d.total)));
  const lineas = (d.lineas || []).map(l => ({ concepto: l.concepto || "", cat: l.cat || "", importe: l.importe === "" || l.importe == null ? null : r2(num(l.importe)) }));
  if (d.tipo !== "traspaso") {
    const empty = lineas.filter(l => l.importe == null);
    const s = r2(sum(lineas.filter(l => l.importe != null).map(l => l.importe)));
    if (!total && s) total = s;
    if (empty.length === 1) empty[0].importe = r2(total - s);
    for (const l of lineas) if (l.importe == null) l.importe = 0;
  }
  if (!total) return { err: "Falta el total." };
  if (d.tipo === "traspaso") {
    if (!d.cuenta || !d.destino) return { err: "Di de qué cuenta sale y a cuál va." };
    if (d.cuenta === d.destino) return { err: "La cuenta de salida y la de llegada son la misma." };
  }
  // una categoría que no existe (o de otro tipo) no se guarda: la línea queda «sin categoría» y por revisar
  for (const l of lineas) if (l.cat && !(CATIDX[l.cat] && CATIDX[l.cat].tipo === d.tipo)) l.cat = "";
  const m = cleanMov({ ...d, total, lineas: lineas.filter(l => l.importe || l.concepto || l.cat) });
  if (m.tipo !== "traspaso") {
    const s = linesSum(m);
    const diff = r2(m.total - s);
    if (Math.abs(diff) >= 0.01) {
      // lo que no cuadra no se pierde: va a una línea aparte, en la categoría de la línea más grande
      const big = m.lineas.slice().sort((a, b) => b.importe - a.importe)[0];
      m.lineas.push({ concepto: diff > 0 ? "Resto del ticket" : "Ajuste", cat: big ? big.cat : "", importe: diff });
    }
    m.revisar = m.lineas.some(l => !l.cat) || !m.lineas.length || !!d.pregunta;
    // sólo una parte es tuya: el gasto es tu parte (cada línea en proporción) y se guarda el total del papel
    const parte = r2(Math.abs(num(d.parte)));
    if (!d.id && parte > 0 && parte < m.total - 0.005) {
      const f = parte / m.total;
      m.lineas = m.lineas.map(l => ({ ...l, importe: r2(l.importe * f) }));
      const res = r2(parte - linesSum(m));
      if (Math.abs(res) >= 0.005 && m.lineas.length) { const big = m.lineas.slice().sort((a, b) => b.importe - a.importe)[0]; big.importe = r2(big.importe + res); }
      m.ticketTotal = m.total; m.total = parte;
      const aviso = `Mi parte de un ticket de ${eur(m.ticketTotal)}`;
      m.nota = (m.nota ? m.nota + " · " : "") + aviso;
    }
  } else m.revisar = false;
  return { mov: m };
}

/* ================= escribir en la base ================= */
const queues = {};
function serial(path, fn){ const p = (queues[path] || Promise.resolve()).then(fn); queues[path] = p.catch(() => {}); return p; }
let movsReady = false;
async function putItems(key, items){
  return serial("movs/" + key, async () => {
    const ref = db.doc("movs/" + key);
    if (meses[key]) {
      try { await ref.update({ items }); return; }
      catch (e) { if (!e || e.code !== "invalid_argument") throw e; }
    }
    const cur = (meses[key] && meses[key].items) || {};
    const merged = { ...cur, ...items };
    await ref.set({ mes: key, items: merged });
    meses[key] = { mes: key, items: merged };
  });
}
async function saveMovs(list){
  if (!db || !movsReady) throw { code: "nodb" };
  const by = {};
  for (const m of list) (by[m.fecha.slice(0, 7)] ||= {})[m.id] = m;
  for (const [k, items] of Object.entries(by)) await putItems(k, items);
}
async function deleteMov(m){ if (!db) throw { code: "nodb" }; await putItems(m.fecha.slice(0, 7), { [m.id]: null }); }
async function saveCfg(name, data){ if (!db) throw { code: "nodb" }; return serial("config/" + name, () => db.doc("config/" + name).set(data)); }
async function saveAnio(y, patch){
  if (!db) throw { code: "nodb" };
  const cur = anio(y);
  const doc = { recurrentes: cur.recurrentes, presupuesto: cur.presupuesto, objetivos: cur.objetivos, ...patch };
  anios[String(y)] = doc; FC = {};
  return serial("anios/" + y, () => db.doc("anios/" + y).set(doc));
}
const saveErr = e => e && e.code === "nodb" ? (WEB ? "No hay conexión con la base de datos: revisa internet y vuelve a entrar." : "Aquí no se puede guardar: abre la página desde tu cuenta de Claude.") : e && e.code === "quota_exceeded" ? "Se ha llenado el espacio de la app." : "No se ha podido guardar. Prueba otra vez.";

async function saveDraft(key){
  const d = DRAFTS[key]; if (!d) return;
  const errBox = document.getElementById(key + "-err");
  const r = draftToMov(d);
  if (r.err) { if (errBox) errBox.textContent = r.err; return; }
  // repetido: el primer «Guardar» sólo avisa; si se vuelve a pulsar, es que es otro ticket y se guarda
  if (!d.id && repetido(d) && !d.repOk) { d.repOk = true; if (errBox) errBox.textContent = "Parece repetido (mira el aviso de arriba). Si es otro ticket, dale otra vez a Guardar."; return; }
  const btn = document.querySelector(`[data-edsave="${key}"]`); if (btn) { btn.disabled = true; btn.textContent = "Guardando…"; }
  try {
    const m = r.mov;
    if (d.blob && !m.ticket && assets) {
      try { const up = await assets.upload(d.blob); m.ticket = up.id; d.ticket = up.id; } catch { /* sin foto, pero el gasto se guarda igual */ }
    }
    if (d.id && d.origFecha && d.origFecha.slice(0, 7) !== m.fecha.slice(0, 7)) await deleteMov({ id: d.id, fecha: d.origFecha });
    const antes = d.id ? MOVS.find(x => x.id === d.id) : null;
    // si cambias dónde fue, el nombre de Drive sale de lo que pones tú, no de la razón social que leyó la IA
    if (antes && m.factura && norm(m.comercio) !== norm(antes.comercio)) m.factura = { ...m.factura, proveedor: "", cif: "" };
    await saveMovs([m]);
    if ((m.ticket || d.pdf) && !m.drive) driveUp(m, d.pdf);
    else if (m.drive && antes && (antes.fecha !== m.fecha || num(antes.total) !== num(m.total) || norm(antes.comercio) !== norm(m.comercio))) driveUp(m, null, false, true);
    if (d.onSaved) d.onSaved(m);
    toast(d.id ? "Cambios guardados" : m.tipo === "gasto" ? "Gasto guardado" : m.tipo === "ingreso" ? "Ingreso guardado" : "Traspaso guardado");
    delete DRAFTS[key];
    if (key === "edit") closeSheet(); else { removeJob(key); renderView(); }
  } catch (e) {
    if (errBox) errBox.textContent = saveErr(e);
    if (btn) { btn.disabled = false; btn.textContent = "Guardar"; }
  }
}

/* ================= archivar los tickets en Google Drive (sólo en la web) ================= */
// Como Senda: 02 - JUAN / 04 - FACTURAS / 01 Tickets / año / trimestre / AAAAMMDD_PROVEEDOR_IMPORTE€_NUMERO.pdf.
// Lo hace la Edge Function cuentas-drive; aquí sólo se le pasa el ticket y se apunta en el movimiento
// dónde ha quedado (m.drive). De uno en uno, en cola, para no atascar.
let driveApi = null, driveCola = Promise.resolve(), driveErr = "";
const toB64 = blob => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = ko; r.readAsDataURL(blob); });
function driveUp(m, pdf, quiet, renombrar){
  if (!driveApi) return Promise.resolve(false);
  const p = driveCola.then(async () => {
    try {
      const f = m.factura || {};
      const it = { id: m.id, fecha: m.fecha, proveedor: f.proveedor || m.comercio, cif: f.cif || "", numero: f.numero || "", total: m.ticketTotal || m.total };
      if (renombrar && m.drive && m.drive.fileId) it.fileId = m.drive.fileId;
      else if (pdf && pdf.size < 10e6) { it.data = await toB64(pdf); it.mime = "application/pdf"; } else if (m.ticket) it.ticket = m.ticket; else return false;
      const [r] = await driveApi.subir([it]);
      if (!r || !r.ok) throw { message: (r && r.error) || "" };
      const drive = { fileId: r.fileId, nombre: r.nombre, ruta: r.ruta, enlace: r.enlace || "" };
      await putItems(m.fecha.slice(0, 7), { [m.id]: { drive, driveError: null } });
      driveErr = "";
      return true;
    } catch (e) {
      driveErr = e && e.code === "no_drive" ? "Falta el permiso de Google Drive (mira «Tickets en Drive», en Dinero)." : "No se ha podido subir a Drive" + (e && e.message ? ": " + e.message : ".");
      // el porqué se queda en el movimiento: así se puede mirar después y se reintenta solo más tarde
      try { await putItems(m.fecha.slice(0, 7), { [m.id]: { driveError: { msg: String(driveErr).slice(0, 300), code: (e && e.code) || "", at: Date.now() } } }); } catch {}
      if (!quiet) toast(e && e.code === "no_drive" ? "Guardado, pero falta el permiso de Google Drive" : "Guardado, pero no se ha podido subir a Drive");
      return false;
    }
  });
  driveCola = p.catch(() => {});
  return p;
}

// Al abrir la web, los tickets que se quedaron sin subir (porque falló Drive o no había conexión) se suben
// solos, en segundo plano. Uno que falló se vuelve a intentar pasada media hora.
let driveAutoHecho = false;
async function driveAuto(){
  if (driveAutoHecho || !driveApi || !movsReady) return;
  driveAutoHecho = true;
  const faltan = MOVS.filter(m => m.ticket && !m.drive && !(m.driveError && Date.now() - num(m.driveError.at) < 30 * 6e4)).slice(0, 10);
  let ok = 0;
  for (const m of faltan) { if (await driveUp(m, null, true)) ok++; else if (/permiso|carpeta/.test(driveErr)) break; }
  if (ok) toast(ok === 1 ? "Subido a Drive un ticket que faltaba" : `Subidos a Drive ${ok} tickets que faltaban`);
  if (faltan.length && tab === "dinero" && !typing()) renderView();
}

/* ---------- lo que la IA necesita saber ---------- */
function catListForIA(tipo){ return Object.entries(CATIDX).filter(([, c]) => !tipo || c.tipo === tipo).map(([id, c]) => `${id} = ${c.tipo === "gasto" ? "gasto" : "ingreso"} · ${c.gNombre} › ${c.nombre}`).join("\n"); }
function learnedForIA(){
  const seen = new Map();
  for (const m of MOVS) {
    if (m.tipo === "traspaso" || !m.comercio || m.revisar) continue;
    const k = norm(m.comercio); if (!k || seen.has(k)) continue;
    const cs = [...new Set(m.lineas.map(l => l.cat).filter(Boolean))];
    if (cs.length) seen.set(k, `${m.comercio} → ${cs.join(", ")}`);
    if (seen.size >= 60) break;
  }
  return seen.size ? [...seen.values()].join("\n") : "(todavía nada)";
}
function accountsForIA(){ return cuentas().map(c => `${c.id} = ${c.nombre} (${ACC_TYPES[c.tipo] || c.tipo}${c.tarjetas ? ", tarjetas acabadas en " + c.tarjetas : ""})`).join("\n"); }
function guessAccount(o){
  const pago = String(o.pago || "").toLowerCase();
  if (o.cuenta && cuenta(o.cuenta)) return o.cuenta;
  if (pago === "efectivo" && cashAccount()) return cashAccount();
  const fin = String(o.tarjeta_final || "").replace(/\D/g, "");
  if (fin) { const c = cuentas().find(c => String(c.tarjetas || "").split(/[^0-9]+/).includes(fin)); if (c) return c.id; }
  return defaultAccount();
}
// La pregunta de la IA cuando duda de una categoría: sólo con opciones que existan
function preguntaDe(p, tipo, nLineas){
  if (!p || typeof p !== "object" || !String(p.texto || "").trim()) return null;
  const opciones = (Array.isArray(p.opciones) ? p.opciones : []).filter(o => o && CATIDX[o.cat] && CATIDX[o.cat].tipo === tipo)
    .slice(0, 4).map(o => ({ etiqueta: String(o.etiqueta || catName(o.cat)).slice(0, 40), cat: o.cat }));
  if (opciones.length < 2) return null;
  const linea = Math.min(Math.max(0, parseInt(p.linea) || 0), Math.max(0, nLineas - 1));
  return { texto: String(p.texto).trim().slice(0, 160), linea, opciones };
}
function iaToDraft(o, origen){
  const tipo = ["gasto", "ingreso", "traspaso"].includes(o.tipo) ? o.tipo : "gasto";
  const lineas = (Array.isArray(o.lineas) ? o.lineas : []).map(l => ({ concepto: String(l.concepto || ""), cat: CATIDX[l.cat] && CATIDX[l.cat].tipo === tipo ? l.cat : "", importe: l.importe == null ? "" : r2(num(l.importe)) }));
  const fecha = /^\d{4}-\d{2}-\d{2}$/.test(o.fecha || "") ? o.fecha : "";
  const notes = [];
  if (!fecha) notes.push("No he visto la fecha: ponla tú.");
  if (o.total == null) notes.push("No he visto el total.");
  if (o.dudas) notes.push(o.dudas);
  const aMano = String(o.manuscrito || "").trim().slice(0, 400);
  if (aMano) notes.push("Lo escrito a mano está en la nota.");
  const conf = num(o.confianza);
  return newDraft({
    tipo, fecha: fecha || toISO(NOW), total: o.total == null ? "" : r2(Math.abs(num(o.total))),
    cuenta: tipo === "traspaso" ? (cuenta(o.cuenta) ? o.cuenta : defaultAccount()) : guessAccount(o),
    destino: tipo === "traspaso" ? (cuenta(o.destino) ? o.destino : (String(o.destino || "").toLowerCase().includes("efectivo") ? cashAccount() : "")) : "",
    comercio: String(o.comercio || ""), nota: aMano, origen,
    factura: o.razon_social || o.numero || o.cif ? { proveedor: String(o.razon_social || "").slice(0, 120), cif: String(o.cif || "").slice(0, 20), numero: String(o.numero || "").slice(0, 40) } : null,
    lineas: lineas.length ? lineas : [{ concepto: "", cat: "", importe: "" }],
    iaNote: notes.length ? notes.join(" ") : (conf && conf < 0.6 ? "La IA no lo ha tenido del todo claro: repásalo." : ""),
    pregunta: preguntaDe(o.pregunta, tipo, lineas.length),
    pagos: (Array.isArray(o.pagos) ? o.pagos : []).map(p => ({ forma: String(p && p.forma || "").slice(0, 20), importe: r2(Math.abs(num(p && p.importe))) })).filter(p => p.importe > 0).slice(0, 8)
  });
}

async function loadScript(src){
  if (document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
}
async function pdfLib(){
  if (!window.pdfjsLib) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  }
  return window.pdfjsLib;
}
async function pdfRead(file, maxPages){
  const lib = await pdfLib();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let text = ""; const images = [];
  const n = Math.min(doc.numPages, maxPages || 3);
  for (let p = 1; p <= doc.numPages && p <= 40; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    let lastY = null, line = "";
    for (const it of tc.items) { const y = it.transform ? Math.round(it.transform[5]) : null; if (lastY != null && y !== lastY) { text += line.trim() + "\n"; line = ""; } line += it.str + " "; lastY = y; }
    text += line.trim() + "\n\n";
    if (p <= n) {
      const vp = page.getViewport({ scale: 1 }); const k = Math.min(2, 1400 / Math.max(vp.width, vp.height));
      const v2 = page.getViewport({ scale: k }); const c = document.createElement("canvas"); c.width = v2.width; c.height = v2.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: v2 }).promise;
      images.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
    }
  }
  return { text: text.trim(), images };
}
async function shrink(file){
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  if (!bmp) return file;
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
}
function ticketPrompt(extraText){
  return `Eres el contable personal de Juan (España). Te paso ${extraText ? "el texto de una factura o ticket" : "la foto de un ticket o factura"} de sus cuentas PERSONALES. Léelo y devuelve SOLO un objeto JSON, sin nada más:
{"tipo":"gasto"|"ingreso","comercio":texto o null,"razon_social":texto o null,"cif":texto o null,"numero":texto o null,"fecha":"AAAA-MM-DD" o null,"total":número o null,"pago":"tarjeta"|"efectivo"|"bizum"|"transferencia"|"domiciliado"|null,"tarjeta_final":"4 cifras" o null,"lineas":[{"concepto":texto,"cat":id,"importe":número}],"confianza":número de 0 a 1,"dudas":texto o null,"manuscrito":texto o null,"pagos":[{"forma":"tarjeta"|"efectivo"|"bizum"|"otro","importe":número}],"pregunta":null o {"linea":número de línea empezando en 0,"texto":texto,"opciones":[{"etiqueta":texto,"cat":id}]}}

Reglas:
- No inventes. Lo que no se lea, null. Si no es un ticket ni una factura, pon confianza 0 y explícalo en "dudas".
- "comercio": el nombre corto del sitio, como lo diría una persona («Mercadona», «Repsol», «Endesa»), no la razón social entera.
- "razon_social": quien factura, tal como sale en el papel («Mercadona, S.A.», «Estación de Servicio Los Pinos, S.L.»), con el centro si lo pone; "cif": su CIF o NIF; "numero": el número de factura o de ticket tal cual. Lo que no salga, null.
- Importes tal y como se pagan, con IVA incluido. Punto decimal en el JSON.
- Agrupa por categoría: NO una línea por producto, sino una línea por categoría con la suma de sus productos y un concepto que lo resuma, p. ej. «Comida (leche, pan, fruta…)» y «Droguería (lejía, papel…)». Los descuentos, dentro de la línea a la que afectan.
- La suma de las líneas tiene que dar exactamente el total del papel. Si no te cuadra, dilo en "dudas".
- Bodas: lo que se gasta con motivo de una boda a la que va Juan (el regalo o el sobre a los novios, una lista de bodas, un traje o vestido o complementos para la boda, el hotel o el viaje a la boda, una despedida de soltero, la peluquería para la boda) va a «bodas.*», no a ropa, regalos o viajes. Si algo podría ser de una boda pero no lo sabes (un traje, un hotel, un regalo caro), usa "pregunta" para preguntárselo.
- Categorías: NO uses «compras.otras», «otros.varios» ni «otrosi.varios» salvo que de verdad no encaje en ninguna otra. Si dudas entre dos o tres categorías porque depende de algo que sólo sabe Juan (p. ej. si algo es un regalo o para él, si una cena es de ocio o de trabajo), pon en "cat" la más probable y rellena "pregunta": una pregunta corta y directa a Juan sobre esa línea, con 2 a 4 opciones, cada una con su categoría. Si no hay dudas, "pregunta" es null.
- "cat" tiene que ser uno de estos ids, exactamente:
${catListForIA()}
- Así ha clasificado Juan otras veces (úsalo como guía, manda sobre tu criterio; pero si el producto es claramente de otra cosa, como cartuchos en una tienda de deporte, manda el producto):
${learnedForIA()}
- Clasifica por lo que es cada producto, no por la tienda: unos cartuchos comprados en Decathlon son caza, no deporte. Cartuchos y munición (calibre, gramos, nº de perdigón, marcas como RIO, Saga, Fenix, Trust, Mirage; «SP RIO 50 34G/09» = cartuchos RIO de 34 g del nº 9), licencias de caza o de armas, coto, monterías, armero, ropa de caza y perros de caza van a las categorías «caza.*».
- Si la misma línea sale repetida varias veces, súmalas en una sola.
- El total es lo que cuesta la compra. «Efectivo», «Entregado» o «Pagado» es lo que dio el cliente, y «Cambio» o «Devolución efectivo» es la vuelta: no son el total ni otro gasto. Si pone «Efectivo», el pago es "efectivo".
- "tarjeta_final" SÓLO si se pagó con tarjeta bancaria. La tarjeta de socio, de puntos o de fidelización de la tienda (Decathlon, Carrefour Club, Mercadona…) no es la forma de pago: no la pongas.
- "manuscrito": todo lo que esté ESCRITO A MANO en el papel (con bolígrafo, lápiz o rotulador, no lo impreso), copiado tal cual y en el orden en que aparece: para qué fue, con quién, una obra, un nombre, «pagado», una cuenta hecha a mano… Si es difícil de leer, pon lo que se entienda y marca lo dudoso con «(?)». Si no hay nada escrito a mano, null. Si a mano se ha añadido una propina, súmala al total en una línea aparte «Propina» con la categoría del resto y dilo en "dudas".
- "pagos": cada pago que sale al pie del ticket, por separado (si se pagó con varias tarjetas y efectivo, uno por cada uno). Al efectivo réstale el cambio: «Efectivo 20,00 / Cambio 1,30» es un pago de 18,70 en efectivo. Si sólo hay un pago o no se ve, [].
- En una «factura simplificada» el "numero" es su número (p. ej. V2026036400100040626).
- Fechas de España: 03/09/26 es el 3 de septiembre de 2026; 21/8/2026 es el 21 de agosto. Hoy es ${toISO(NOW)}.${extraText ? "\n\nTexto del papel:\n" + extraText.slice(0, 40000) : ""}`;
}
async function readTicket(key, files){
  const j = JOBS.find(x => x.key === key); if (!j) return;
  jobUpdate(key, { state: "leyendo", msg: "Preparando…" });
  try {
    let images = [], text = "", thumb = null, pdf = null;
    for (const f of files) {
      if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        jobUpdate(key, { msg: "Abriendo el PDF…" });
        const r = await pdfRead(f, 2);
        if (!pdf && files.length === 1) pdf = f;   // el PDF tal cual, para archivarlo en Drive
        if (r.text.replace(/\s/g, "").length > 60) text += r.text + "\n"; else images.push(...r.images);
        if (!thumb && r.images[0]) thumb = r.images[0];
      } else { const b = await shrink(f); images.push(b); if (!thumb) thumb = b; }
    }
    const maxImg = (imgCaps && imgCaps.images && imgCaps.images.maxCount) || 0;
    if (images.length && !maxImg && !text) throw { mine: "Este aparato no deja mandar fotos a la IA. Apúntalo a mano o sube la factura en PDF." };
    images = images.slice(0, maxImg || 0);
    jobUpdate(key, { msg: "La IA está leyendo el papel…" });
    const o = await sample.json(ticketPrompt(text), { images: images.length ? images : undefined, cache: false });
    if (!o || typeof o !== "object") throw { mine: "La IA no ha devuelto nada que se pueda usar." };
    const d = iaToDraft(o, "ticket");
    d.blob = thumb; d.ticketUrl = thumb ? URL.createObjectURL(thumb) : ""; d.pdf = pdf;
    d.revisar = num(o.confianza) < 0.6;
    DRAFTS[key] = d;
    jobUpdate(key, { state: "listo", name: d.comercio || "Ticket", url: d.ticketUrl });
  } catch (e) {
    const msg = e && e.mine ? e.mine : e && e.code === "not_granted" ? "No has dado permiso para usar la IA." : e && e.code === "rate_limited" ? "Demasiados tickets seguidos. Espera un minuto y dale a «Probar otra vez»." : e && e.code === "invalid_json" ? "La IA no ha sabido leerlo bien." : "No he podido leerlo.";
    jobUpdate(key, { state: "error", err: msg, retry: true });
  }
}
async function onTicketFiles(fileList){
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type) || f.type === "application/pdf" || /\.pdf$/i.test(f.name));
  if (!files.length) return;
  const together = $("#same-ticket") && $("#same-ticket").checked;
  const groups = together ? [files] : files.map(f => [f]);
  const keys = groups.map(g => { const k = addJob("ticket", null, { name: g[0].name.replace(/\.[^.]+$/, "").slice(0, 40) || "Ticket" }); JOBS.find(x => x.key === k).files = g; return k; });
  renderView();
  for (let i = 0; i < groups.length; i++) await readTicket(keys[i], groups[i]);   // de uno en uno, para no atascar a la IA
}
