/* ================= cámara propia: la de atrás, dentro de la página ================= */
// Con <input capture="environment"> el móvil abre su app de Cámara, y la de Samsung ignora esa preferencia
// y se abre con la última cámara usada (la de delante). Aquí se abre la cámara desde la propia web, se pide
// la de atrás y, si el móvil da otra, se busca la de atrás por su nombre. Si no se puede (sin permiso o un
// navegador sin cámara), se cae al <input> de siempre.
let camAbierta = null;   // {stream, root}
const camPuede = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
function camCerrar(){
  if (!camAbierta) return;
  for (const t of camAbierta.stream ? camAbierta.stream.getTracks() : []) t.stop();
  camAbierta.root.remove(); camAbierta = null; document.body.style.overflow = "";
}
async function camStream(deviceId){
  const video = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: "environment" } };
  return navigator.mediaDevices.getUserMedia({ audio: false, video: { ...video, width: { ideal: 3840 }, height: { ideal: 2160 } } });
}
// Abre la cámara; cuando se hace la foto, llama a onFoto(file). Devuelve false si no se ha podido abrir.
async function abrirCamara(onFoto){
  if (!camPuede() || camAbierta) return false;
  const root = document.createElement("div");
  root.className = "cam";
  root.innerHTML = `<video playsinline autoplay muted></video>
    <div class="cam-msg">Encuadra el ticket entero</div>
    <div class="cam-bar"><button type="button" class="cam-btn" data-cam="x">Cancelar</button><button type="button" class="cam-shot" data-cam="foto" aria-label="Hacer la foto"></button><button type="button" class="cam-btn" data-cam="luz" hidden>Linterna</button></div>`;
  document.body.appendChild(root); document.body.style.overflow = "hidden";
  camAbierta = { root, stream: null };
  let stream;
  try {
    stream = await camStream();
    // si el móvil ha dado la de delante, se busca la de atrás por su nombre
    const s = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
    if (s.facingMode && s.facingMode !== "environment") {
      const atras = (await navigator.mediaDevices.enumerateDevices()).find(d => d.kind === "videoinput" && /back|rear|trasera|environment|0, facing back/i.test(d.label));
      if (atras) { for (const t of stream.getTracks()) t.stop(); stream = await camStream(atras.deviceId); }
    }
  } catch (e) {
    camCerrar();
    toast(e && e.name === "NotAllowedError" ? "Sin permiso para la cámara: dale permiso en el navegador o elige la foto de la galería." : "No he podido abrir la cámara: elige la foto de la galería.");
    return true;   // ya se ha avisado: no abrir además el selector
  }
  if (!camAbierta) { for (const t of stream.getTracks()) t.stop(); return true; }
  camAbierta.stream = stream;
  const video = root.querySelector("video"); video.srcObject = stream;
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  let luz = false;
  const bLuz = root.querySelector('[data-cam="luz"]');
  if (caps.torch) bLuz.hidden = false;
  root.addEventListener("click", async e => {
    const b = e.target.closest("[data-cam]"); if (!b) return;
    if (b.dataset.cam === "x") return camCerrar();
    if (b.dataset.cam === "luz") { luz = !luz; try { await track.applyConstraints({ advanced: [{ torch: luz }] }); b.setAttribute("aria-pressed", luz); } catch {} return; }
    if (b.dataset.cam === "foto") {
      b.disabled = true;
      let blob = null;
      try { if (window.ImageCapture) blob = await new ImageCapture(track).takePhoto(); } catch { blob = null; }   // la foto a resolución completa
      if (!blob) {
        const c = document.createElement("canvas"); c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext("2d").drawImage(video, 0, 0);
        blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
      }
      camCerrar();
      if (blob) onFoto(new File([blob], "ticket-" + Date.now() + ".jpg", { type: blob.type || "image/jpeg" }));
    }
  });
  return true;
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && camAbierta) camCerrar(); });

function decodeText(buf){
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes(String.fromCharCode(0xFFFD))) t = new TextDecoder("windows-1252").decode(buf);
  return t;
}

async function onExtractFile(file){
  if (!file) return;
  Object.assign(EXT, { rows: [], busy: true, msg: "Abriendo el fichero…", err: "", file: file.name, saldo: null, useSaldo: true });
  renderView();
  try {
    const text = (await extractText(file)).replace(/\r/g, "");
    const lines = text.split("\n").map(l => l.replace(/;+$/, "").trim()).filter(l => l && /\d/.test(l));
    if (!lines.length) throw { mine: "El fichero está vacío o no lo sé abrir." };
    const head = text.split("\n").slice(0, 12).join("\n").slice(0, 3000);
    const chunks = []; let cur = [], size = 0;
    for (const l of lines) { if (cur.length >= 90 || size + l.length > 24000) { chunks.push(cur.join("\n")); cur = []; size = 0; } cur.push(l.slice(0, 400)); size += l.length; }
    if (cur.length) chunks.push(cur.join("\n"));
    if (chunks.length > 30) throw { mine: "El fichero es muy grande. Bájate el extracto por meses o por trimestres." };
    const out = [];
    for (let i = 0; i < chunks.length; i++) {
      EXT.msg = chunks.length > 1 ? `La IA está leyendo el extracto: trozo ${i + 1} de ${chunks.length}…` : "La IA está leyendo el extracto…"; renderView();
      const o = await sample.json(extPrompt(head, chunks[i], i + 1, chunks.length), { cache: false });
      for (const m of (o && o.movimientos) || []) if (m && /^\d{4}-\d{2}-\d{2}$/.test(m.fecha || "") && num(m.importe)) out.push(m);
    }
    if (!out.length) throw { mine: "No he encontrado movimientos en el fichero." };
    const acc = EXT.cuenta;
    EXT.rows = out.map(m => {
      const imp = r2(num(m.importe));
      const tipo = imp < 0 ? "gasto" : "ingreso";
      const dest = m.traspaso_a && cuenta(m.traspaso_a) && m.traspaso_a !== acc ? m.traspaso_a : "";
      const r = { fecha: m.fecha, concepto: String(m.concepto || m.comercio || "").slice(0, 120), comercio: String(m.comercio || "").slice(0, 60), imp, cat: CATIDX[m.cat] && CATIDX[m.cat].tipo === tipo ? m.cat : "", dest, saldo: m.saldo == null ? null : num(m.saldo), low: num(m.confianza) < 0.6, sel: true, dup: "", match: null };
      return r;
    });
    markDups();
    // el último saldo que da el extracto sirve para poner la cuenta al día
    const withSaldo = EXT.rows.map((r, i) => ({ r, i })).filter(x => x.r.saldo != null);
    if (withSaldo.length) {
      const maxF = withSaldo.reduce((a, x) => x.r.fecha > a ? x.r.fecha : a, "");
      const lastDay = withSaldo.filter(x => x.r.fecha === maxF);
      // si el extracto va de más nuevo a más antiguo, el primero del día es el último; se toma el que siga a los demás
      const pick = lastDay.length === 1 ? lastDay[0] : (withSaldo[0].r.fecha >= withSaldo[withSaldo.length - 1].r.fecha ? lastDay[0] : lastDay[lastDay.length - 1]);
      EXT.saldo = { v: r2(pick.r.saldo), fecha: pick.r.fecha };
    }
  } catch (e) {
    EXT.err = e && e.mine ? e.mine : e && e.code === "not_granted" ? "No has dado permiso para usar la IA." : e && e.code === "rate_limited" ? "La IA está saturada. Espera un minuto y vuelve a probar." : "No he podido leer el fichero.";
    EXT.rows = [];
  }
  EXT.busy = false; renderView();
}
function markDups(){
  const acc = EXT.cuenta, used = new Set();
  for (const r of EXT.rows) {
    const tipo = r.dest ? "traspaso" : r.imp < 0 ? "gasto" : "ingreso";
    const tot = Math.abs(r.imp);
    // ya importado de un extracto anterior
    const same = MOVS.find(m => m.origen === "extracto" && (m.cuenta === acc || m.destino === acc) && m.fecha === r.fecha && (m.deuda ? norm(m.nota).startsWith(norm(r.concepto)) : Math.abs(num(m.total) - tot) < 0.01 && norm(m.nota) === norm(r.concepto)));
    if (same) { r.dup = "Ya estaba importado."; r.sel = false; continue; }
    // apuntado antes con un ticket, dictado o a mano
    const dd = d => Math.abs((parseISO(d) - parseISO(r.fecha)) / 864e5);
    const cand = MOVS.filter(m => m.origen !== "extracto" && !m.banco && !used.has(m.id) && m.tipo === tipo && Math.abs(num(m.total) - tot) < 0.01 && dd(m.fecha) <= 4 && (!m.cuenta || m.cuenta === acc || (tipo === "traspaso" && m.destino === acc)))
      .sort((a, b) => dd(a.fecha) - dd(b.fecha));
    if (cand.length) { used.add(cand[0].id); r.match = cand[0].id; r.sel = false; r.dup = `Ya lo tenías: ${movTitle(cand[0])} del ${shortDate(cand[0].fecha)}. Se queda el tuyo.`; }
  }
}
async function extSave(){
  const errBox = $("#ext-err"), btn = $("#ext-save");
  if (btn) { btn.disabled = true; btn.textContent = "Guardando…"; }
  const acc = EXT.cuenta;
  try {
    const list = [];
    for (const r of EXT.rows.filter(r => r.sel)) {
      const out = r.imp < 0;
      const dc = r.dest && out ? cuenta(r.dest) : null;
      if (dc && dc.tipo === "prestamo") {
        // la cuota de un préstamo: lo que devuelves baja la deuda, los intereses son gasto
        const q = repartoCuota(dc, Math.abs(r.imp), r.fecha);
        if (q.capital) list.push(cleanMov({ fecha: r.fecha, tipo: "traspaso", cuenta: acc, destino: dc.id, comercio: dc.nombre, nota: r.concepto, total: q.capital, origen: "extracto", banco: true, deuda: dc.id }));
        if (q.interes) list.push(cleanMov({ fecha: r.fecha, tipo: "gasto", cuenta: acc, comercio: dc.nombre, nota: r.concepto + " (intereses)", total: q.interes, lineas: [{ concepto: "Intereses de " + dc.nombre, cat: "finanzas.intereses", importe: q.interes }], origen: "extracto", banco: true, deuda: dc.id }));
      }
      else if (r.dest) list.push(cleanMov({ fecha: r.fecha, tipo: "traspaso", cuenta: out ? acc : r.dest, destino: out ? r.dest : acc, comercio: r.comercio || r.concepto, nota: r.concepto, total: Math.abs(r.imp), origen: "extracto", banco: true }));
      else {
        const tipo = out ? "gasto" : "ingreso";
        list.push(cleanMov({ fecha: r.fecha, tipo, cuenta: acc, comercio: r.comercio || r.concepto, nota: r.concepto, total: Math.abs(r.imp), lineas: [{ concepto: r.concepto, cat: r.cat, importe: Math.abs(r.imp) }], origen: "extracto", banco: true, revisar: !r.cat || r.low }));
      }
    }
    // lo que ya estaba apuntado queda marcado como visto en el banco, y con su cuenta si no la tenía
    const touched = [];
    for (const r of EXT.rows.filter(r => r.match && !r.sel)) {
      const m = MOVS.find(x => x.id === r.match); if (!m) continue;
      touched.push({ ...m, banco: true, cuenta: m.cuenta || (m.tipo === "traspaso" ? m.cuenta : acc) });
    }
    await saveMovs(list.concat(touched));
    if (EXT.saldo && EXT.useSaldo) {
      const cs = (cfg.cuentas || cuentas()).map(c => c.id === acc ? { ...c, ancla: { fecha: EXT.saldo.fecha, saldo: EXT.saldo.v, ts: Date.now() + 1e12 } } : c);
      await saveCfg("cuentas", { items: cs });
    }
    toast(`Guardados ${list.length} movimientos`);
    Object.assign(EXT, { rows: [], file: "", saldo: null });
    renderView();
  } catch (e) {
    if (errBox) errBox.textContent = saveErr(e);
    if (btn) { btn.disabled = false; btn.textContent = "Guardar"; }
  }
}

  for (const k of ["nombre", "entidad", "saldo", "tarjetas", "tae", "vence", "inicial", "cuota", "tin", "termina", "limite", "pago"]) { const i = document.getElementById("af-" + k); if (i) a[k] = i.value; }
  const hb = $("#af-hab"); if (hb) a.habitual = hb.checked;
}
async function saveAccForm(){
  readAccForm();
  const a = accForm;
  const nombre = (a.nombre || "").trim() || (a.tipo === "efectivo" ? "Efectivo" : (a.entidad || "").trim());
  if (!nombre) { $("#af-err").textContent = "Ponle un nombre."; return; }
  const list = (cfg.cuentas && cfg.cuentas.length ? cfg.cuentas : cuentas()).map(c => ({ ...c }));
  const base = { nombre, tipo: a.tipo, entidad: (a.entidad || "").trim(), tarjetas: String(a.tarjetas || "").replace(/[^0-9 ,]/g, "").trim(), tae: a.tae ? num(a.tae) : null, vence: a.vence || null,
    inicial: a.inicial ? r2(num(a.inicial)) : null, cuota: a.cuota ? r2(num(a.cuota)) : null, tin: a.tin ? num(a.tin) : null, termina: a.termina || null, limite: a.limite ? r2(num(a.limite)) : null, pago: a.pago || null };
  if (DEBT(a.tipo) && !base.pago) { $("#af-err").textContent = "Di de qué cuenta se paga."; return; }
  if (a.id) { const i = list.findIndex(c => c.id === a.id); if (i >= 0) list[i] = { ...list[i], ...base }; }
  else {
    const id = norm(nombre).replace(/ /g, "-").slice(0, 24) + "-" + uid().slice(-4);
    const v = r2(num(a.saldo));
    list.push({ id, ...base, ancla: a.saldo !== "" && a.saldo != null ? { fecha: toISO(NOW), saldo: DEBT(a.tipo) ? -Math.abs(v) : v, ts: Date.now() } : null });
    a.id = id;
  }
  try {
    await saveCfg("cuentas", { items: list });
    if (a.habitual && a.tipo !== "prestamo") await saveCfg("prefs", { ...(cfg.prefs || {}), cuentaHabitual: a.id });
    accForm = null; toast("Cuenta guardada"); renderView();
  } catch (e) { $("#af-err").textContent = saveErr(e); }
}

function goalSaved(o){ if (o.cuenta && cuenta(o.cuenta)) return saldo(cuenta(o.cuenta), toISO(NOW)); return num(o.apartado); }
function goalCard(o, mini){
  const saved = goalSaved(o), imp = num(o.importe), falta = Math.max(0, imp - saved), p = imp ? Math.min(100, saved / imp * 100) : 0;
  const done = o.hecho || (imp > 0 && falta <= 0.005);
  let k = "";
  if (!done) {
    const am = ahorroMedio();
    if (o.fecha) {
      const f = parseISO(o.fecha);
      const meses = (f.getFullYear() - NOW.getFullYear()) * 12 + f.getMonth() - NOW.getMonth() + (f.getDate() >= NOW.getDate() ? 0 : -1) + 1;
      k += meses > 0 ? `<span>Aparta <b>${eur(falta / meses)}</b> al mes hasta ${MESL[f.getMonth()]}${f.getFullYear() !== NOW.getFullYear() ? " de " + f.getFullYear() : ""}</span>` : `<span style="color:var(--over)">La fecha ya ha pasado</span>`;
    }
    if (am && am.v > 0) { const n = Math.ceil(falta / am.v); const d = new Date(NOW.getFullYear(), NOW.getMonth() + n, 1); k += `<span>Con lo que ahorras (${eur(am.v)} al mes) lo tienes en <b>${MESL[d.getMonth()]} de ${d.getFullYear()}</b></span>`; }
    else if (am) k += `<span>Estos meses estás gastando más de lo que entra: así no llegas.</span>`;
  }
  return `<div class="goal${done ? " done" : ""}"><div class="goal-h"><div><b>${esc(o.nombre)}</b><div class="small muted">${o.tipo === "inversion" ? "Invertir" : "Comprar"}${o.fecha ? " · para " + shortDate(o.fecha) + (parseISO(o.fecha).getFullYear() !== Y ? " de " + parseISO(o.fecha).getFullYear() : "") : ""}${o.cuenta && cuenta(o.cuenta) ? " · lo guardas en " + esc(cuenta(o.cuenta).nombre) : ""}</div></div>${done ? `<span class="pill ok">Conseguido</span>` : `<span class="num">${eur(saved)} de ${eur(imp)}</span>`}</div>
    <div class="prog" role="img" aria-label="${pct(p)} conseguido"><i style="width:${p.toFixed(1)}%"></i></div>
    ${!done && !mini ? `<div class="k"><span>Falta <b>${eur(falta)}</b></span>${k}</div>` : !done ? `<div class="k"><span>Falta <b>${eur(falta)}</b></span></div>` : ""}
    ${mini ? "" : `<div class="row"><button class="btn sm" data-goaledit="${o.id}">Cambiar</button>${!o.cuenta && !done ? `<button class="btn sm ghost" data-goaladd="${o.id}">Apartar dinero</button>` : ""}</div>`}</div>`;
}

/* ---------- fijos y presupuesto ---------- */
function recSuggest(){
  // lo que se repite: mismo sitio, en 3 meses distintos de los últimos 6, con importes parecidos
  const since = toISO(new Date(NOW.getFullYear(), NOW.getMonth() - 6, 1));
  const have = new Set(anio(Y).recurrentes.map(r => norm(r.nombre)));
  const by = new Map();
  for (const m of MOVS) {
    if (m.fecha < since || m.tipo === "traspaso" || !m.comercio) continue;
    const k = m.tipo + "|" + norm(m.comercio); if (!k || have.has(norm(m.comercio))) continue;
    if (!by.has(k)) by.set(k, []); by.get(k).push(m);
  }
  const out = [];
  for (const [k, list] of by) {
    const months = new Set(list.map(m => m.fecha.slice(0, 7)));
    if (months.size < 3) continue;
    const amts = list.map(m => num(m.total)).sort((a, b) => a - b), med = amts[Math.floor(amts.length / 2)];
    if (amts.some(a => Math.abs(a - med) > med * 0.2 + 5)) continue;
    if (list.length > months.size * 1.5) continue;   // varias veces al mes: eso es variable (el súper), no fijo
    const m0 = list[0], cat = (m0.lineas.find(l => l.cat) || {}).cat || "";
    if (list.some(m => m.deuda) || cuentas().some(c => DEBT(c.tipo) && norm(c.nombre) === norm(m0.comercio))) continue;
    if (anio(Y).recurrentes.some(r => r.cat && r.cat === cat && Math.abs(num(r.importe) - med) <= med * 0.2 + 5)) continue;   // ya está como fijo con otro nombre
    out.push({ nombre: m0.comercio, tipo: m0.tipo, cat, importe: r2(med), cada: 1, mes: 1, dia: parseISO(m0.fecha).getDate() });
  }
  return out.slice(0, 12);
}

  if (sugg.length && !heredado) {

  for (const g of cats().gasto) {
    const gf = groupForecast(Y, "gasto", g.id), ant = prevY.byGroupMonth.gasto[g.id] ? sum(prevY.byGroupMonth.gasto[g.id]) : 0, p = num(pres[g.id]);

  }
  const PT = sum(Object.values(pres).map(num));

  const slug = norm(n).replace(/ /g, "").slice(0, 16) || "c" + uid().slice(-4);
  if (f.cid) { const g = list.find(g => g.id === f.gid); const it = g && g.cats.find(x => x[0] === f.cid); if (it) it[1] = n; }
  else if (f.gid && f.rename) { const g = list.find(g => g.id === f.gid); if (g) g.nombre = n; }
  else if (f.gid) { const g = list.find(g => g.id === f.gid); if (g) { let id = slug; while (g.cats.some(x => x[0] === id)) id += "2"; g.cats.push([id, n]); } }
  else { let id = slug; while (list.some(g => g.id === id) || c.gasto.concat(c.ingreso).some(g => g.id === id)) id += "2"; list.push({ id, nombre: n, cats: [["varios", "Varios"]] }); }
  try { await saveCfg("categorias", c); cfg.cats = c; buildCatIdx(); catForm = null; toast("Guardado"); renderView(); }
  catch (e) { $("#cf-err").textContent = saveErr(e); }
}

let pSub = store.get("cj.psub", "resumen");
const PSUBS = () => [["resumen", "Resumen"], ["gastos", "Gastos"], ["ingresos", "Ingresos"], ["viene", "Lo que viene"], ["largo", "Hasta " + MAX_Y], ["fijos", "Fijos y presupuesto"]];

function renderPrevision(){
  const el = $("#v-prevision");
  if (dbState === "loading") { el.innerHTML = `<div class="panel"><div class="thinking"><span class="spin"></span>Cargando…</div></div>`; return; }
  if (!PSUBS().some(([k]) => k === pSub)) pSub = "resumen";
  const f = forecast(Y);
  let h = `<div class="subnav" role="tablist" aria-label="Previsión">${PSUBS().map(([k, n]) => `<button role="tab" data-psub="${k}" aria-selected="${pSub === k}">${esc(n)}</button>`).join("")}</div>`;
  if (f.phase === "pasado" && ["resumen", "gastos", "ingresos"].includes(pSub)) h += `<div class="banner">${Y} ya está cerrado: aquí ves lo que pasó de verdad, no una previsión.</div>`;
  if (pSub === "resumen") h += asiAcabarasHTML(f, true) + mesesPrevisionHTML(f);
  else if (pSub === "gastos" || pSub === "ingresos") h += prevTipoHTML(pSub === "gastos" ? "gasto" : "ingreso");
  else if (pSub === "viene") h += loQueVieneHTML();
  else if (pSub === "largo") h += largoPlazoHTML() || `<div class="panel"><h2>Hasta ${MAX_Y}</h2><p class="why">Para ver cuánto tendrás cada año, primero dime cuánto tienes hoy en cada cuenta.</p><div class="row" style="margin-top:10px"><button class="btn primary sm" data-go="dinero" data-sub="cuentas">Poner mis cuentas</button></div></div>`;
  else h += previsionHTML();
  el.innerHTML = h;
  // gráficos de cada apartado
  if ($("#ch-pmes")) monthBars($("#ch-pmes"), [
    { label: "Ingresos", color: "var(--ing)", real: f.ing, prev: f.pIng },
    { label: "Gastos", color: "var(--gas)", real: f.gas, prev: f.pGas }
  ], { label: "Ingresos y gastos por mes, con lo previsto" });
  if ($("#ch-saldo")) {
    const firstP = f.saldoMes.findIndex(s => s.prev);
    monthLines($("#ch-saldo"), [{ label: "Dinero", color: "var(--sal)", values: f.saldoMes.map(s => s.v), dashFrom: firstP < 0 ? null : firstP, area: true }], { label: "Dinero en cuentas por mes" });
  }
  if ($("#ch-ptipo")) {
    const g = pSub === "gastos";
    monthBars($("#ch-ptipo"), [{ label: g ? "Gastos" : "Ingresos", color: g ? "var(--gas)" : "var(--ing)", real: g ? f.gas : f.ing, prev: g ? f.pGas : f.pIng }], { h: 200, label: (g ? "Gastos" : "Ingresos") + " por mes, con lo previsto" });
  }
  if ($("#ch-largo")) {
    const ys = []; for (let y = CUR_Y; y <= MAX_Y; y++) ys.push(y);
    const fs = ys.map(y => forecast(y));
    const series = [{ label: "Dinero", color: "var(--sal)", values: fs.map(x => x.saldoFin), dashFrom: 0 }];
    if (fs[0].hayDeudas) series.push({ label: "Deuda", color: "var(--over)", values: fs.map(x => x.deudaFinTotal), dashFrom: 0 });
    monthLines($("#ch-largo"), series, { labels: ys.map(String), tipLabels: ys.map(y => "31 dic " + y), label: "Dinero a fin de cada año hasta " + MAX_Y });
  }
}

// Lo que viene: los próximos seis meses, con lo fijo, las cuotas, los vencimientos y los objetivos
function loQueVieneHTML(){
  let h = `<div class="panel"><div class="panel-head"><div><h2>Lo que viene</h2><p>Los próximos seis meses: lo que entra y sale fijo, las cuotas, lo que vence y tus objetivos, y cuánto tendrás a final de cada mes.</p></div><button class="btn sm" data-psub="fijos">Cambiar lo fijo</button></div>`;
  let alguno = false;
  for (let k = 0; k < 6; k++) {
    const d = new Date(NOW.getFullYear(), NOW.getMonth() + k, 1), y = d.getFullYear(), mo = d.getMonth();
    if (y > MAX_Y) break;
    const f = forecast(y), key = y + "-" + pad(mo + 1);
    const items = [];
    const hecho = (r) => MOVS.some(m => m.fecha.startsWith(key) && m.tipo === (r.tipo === "ingreso" ? "ingreso" : "gasto") && ((r.cat && m.lineas.some(l => l.cat === r.cat)) || norm(m.comercio) === norm(r.nombre)) && Math.abs(num(m.total) - num(r.importe)) <= num(r.importe) * 0.15 + 1);
    for (const r of f.recs) if (recHits(r, mo)) items.push({ n: r.nombre, v: (r.tipo === "ingreso" ? 1 : -1) * num(r.importe), ok: k === 0 && hecho(r), t: r.tipo === "ingreso" ? "Entra" : "Sale" });
    for (const c of cuentas()) {
      if (c.tipo === "prestamo" && num(c.cuota) > 0 && c.ancla && debe(c, toISO(NOW)) > 0.005 && !(c.termina && d > parseISO(c.termina))) items.push({ n: "Cuota de " + c.nombre, v: -num(c.cuota), ok: k === 0 && cuotaPagada(c, y, mo), t: "Cuota" });
      if (LENT(c.tipo) && c.vence && c.vence.startsWith(key) && teDebe(c, toISO(NOW)) > 0.005) items.push({ n: c.nombre + " te devuelve", v: 0, info: `dijo que el ${shortDate(c.vence)}: te debe ${eur(teDebe(c, toISO(NOW)))}`, t: "Te deben" });
      if (c.tipo === "deposito" && c.vence && c.vence.startsWith(key)) items.push({ n: "Vence " + c.nombre, v: 0, info: `el ${shortDate(c.vence)}: ${eur(saldo(c, toISO(NOW)))} vuelven a estar libres`, t: "Vence" });
    }
    for (let yy = CUR_Y; yy <= y; yy++) for (const o of anio(yy).objetivos) if (!o.hecho && o.fecha && o.fecha.startsWith(key)) items.push({ n: "Objetivo: " + o.nombre, v: 0, info: `para el ${shortDate(o.fecha)}: ${eur(o.importe)} (te faltan ${eur(Math.max(0, num(o.importe) - goalSaved(o)))})`, t: "Objetivo" });
    const vari = f.varAvg || 0;
    const entra = f.pIng[mo] + (k === 0 ? f.ing[mo] : 0), sale = f.pGas[mo] + (f.pCap ? f.pCap[mo] : 0) + (k === 0 ? f.gas[mo] : 0);
    const s = f.saldoMes[mo];
    if (items.length || entra || sale) alguno = true;
    h += `<div class="day"><h3><span>${cap(MESL[mo])}${y !== CUR_Y ? " " + y : ""}${k === 0 ? " · este mes" : ""}</span><span class="num">${f.hayCuentas ? "a fin de mes: " + eur(s.v) : ""}</span></h3>`;
    for (const it of items.sort((a, b) => a.v - b.v)) h += `<div class="rec"><div><div class="n"${it.ok ? ' style="text-decoration:line-through;color:var(--muted)"' : ""}>${esc(it.n)}</div><div class="m">${esc(it.t)}${it.ok ? " · ya está apuntado" : ""}${it.info ? " · " + esc(it.info) : ""}</div></div><span class="a" style="color:${it.v > 0 ? "var(--ok)" : "inherit"}">${it.v ? (it.v > 0 ? "+" : "−") + eur(Math.abs(it.v)) : ""}</span><span></span></div>`;
    if (vari > 0) h += `<div class="rec"><div><div class="n">Gasto del día a día</div><div class="m">súper, gasolina, comer fuera… (la media de estos meses)</div></div><span class="a">−${eur(vari)}</span><span></span></div>`;
    h += `<p class="small" style="margin:6px 0 0;display:flex;gap:14px;flex-wrap:wrap"><span>Entra <b class="num" style="color:var(--ok)">${eur(entra)}</b></span><span>Sale <b class="num">${eur(sale)}</b></span><span>Queda <b class="num"${entra - sale < 0 ? ' style="color:var(--over)"' : ""}>${eur(entra - sale)}</b></span>${k === 0 ? `<span class="muted">(lo de este mes: lo apuntado más lo que calculo que falta)</span>` : ""}</p></div>`;
  }
  if (!alguno) h += `<p class="empty">Todavía no hay nada que prever. Apunta tus fijos (nómina, hipoteca, recibos…) y lo verás aquí mes a mes.</p>`;
  return h + `</div>`;
}

/* ================= pantalla: a medias (dividir la cuenta) ================= */
// En el bar: foto del ticket + dictar qué ha tomado cada uno → cuánto paga cada uno. Al guardarlo,
// tu parte es un gasto y lo de los demás va a «Lo que te deben» (o lo que debes tú, si pagó otro).
// La cuenta a medio hacer se queda en el móvil (localStorage) por si se cierra la página.
const YO = "Yo";
let split = store.get("cj.split", null);
let splitImg = null, splitImgUrl = "", splitBusy = false, splitErr = "";
function splitNew(){ return { personas: [YO], lineas: [], total: "", propina: "", sitio: "", fecha: toISO(NOW), cat: "", pagador: YO, cuenta: defaultAccount(), dictado: "", hecho: false, dudas: "" }; }
function splitSave(){ store.set("cj.split", split); }
const splitPeopleKnown = () => {
  const s = new Set(store.get("cj.split.gente", []));
  for (const c of cuentas()) if (LENT(c.tipo)) s.add(c.nombre);
  return [...s].filter(n => n && norm(n) !== norm(YO)).slice(0, 20);
};
// Cuánto le toca a cada uno: cada línea se reparte a partes iguales entre los suyos (si no tiene a nadie,
// entre todos); lo que no cuadra con el total del ticket y la propina, en proporción a lo consumido.
function splitCalc(s){
  const P = s.personas, base = Object.fromEntries(P.map(p => [p, 0]));
  let items = 0, sinDueño = 0;
  for (const l of s.lineas) {
    const v = num(l.importe); if (!v) continue;
    items += v;
    const who = (l.personas || []).filter(p => P.includes(p));
    if (!who.length) sinDueño++;
    const list = who.length ? who : P;
    for (const p of list) base[p] += v / list.length;
  }
  const total = num(s.total) || items;
  const extra = (total - items) + num(s.propina);
  const B = sum(Object.values(base));
  const out = {};
  for (const p of P) out[p] = base[p] + (B > 0 ? extra * base[p] / B : extra / P.length);
  // a céntimos, y el céntimo que sobra o falta para quien ha pagado
  const final = total + num(s.propina);
  let acc = 0;
  for (const p of P) { out[p] = r2(out[p]); acc += out[p]; }
  const res = r2(final - acc);
  if (Math.abs(res) >= 0.005 && P.length) { const k = P.includes(s.pagador) ? s.pagador : P[0]; out[k] = r2(out[k] + res); }
  return { por: out, items: r2(items), total: r2(total), final: r2(final), cuadre: r2(total - items), sinDueño };
}

async function splitApuntar(){

  const fecha = s.fecha || toISO(NOW);
  if (fecha > toISO(NOW)) { err.textContent = "La fecha no puede ser de un día que no ha llegado."; return; }

  // la cuenta de cada persona: la que ya tenga en «Lo que te deben», o una nueva
  const list = (cfg.cuentas && cfg.cuentas.length ? cfg.cuentas : cuentas()).map(x => ({ ...x }));
  let nuevas = false;
  const accOf = p => {

    if (!a) { a = { id: "deudor-" + (norm(p).replace(/ /g, "-").slice(0, 20) || "x") + "-" + uid().slice(-4), nombre: p, tipo: "prestado", nota: "", vence: null, fecha, ancla: { fecha: "1900-01-01", saldo: 0, ts: 0 } }; list.push(a); nuevas = true; }
    return a.id;
  };
  const movs = [], mio = c.por[YO] || 0;
  if (s.pagador === YO) {
    if (mio > 0.005) movs.push(cleanMov({ fecha, tipo: "gasto", cuenta: s.cuenta, comercio: sitio, nota: "Tu parte de la cuenta", total: mio, lineas: [{ concepto: "Tu parte en " + sitio, cat, importe: mio }], origen: "dividir" }));
    for (const p of s.personas) if (p !== YO && (c.por[p] || 0) > 0.005) movs.push(cleanMov({ fecha, tipo: "traspaso", cuenta: s.cuenta, destino: accOf(p), comercio: p, nota: "Su parte en " + sitio, total: c.por[p], origen: "dividir" }));
  } else if (mio > 0.005) {
    movs.push(cleanMov({ fecha, tipo: "gasto", cuenta: accOf(s.pagador), comercio: sitio, nota: "Pagó " + s.pagador, total: mio, lineas: [{ concepto: "Tu parte en " + sitio, cat, importe: mio }], origen: "dividir" }));
  }
  if (!movs.length) { err.textContent = "No hay nada que apuntar en tus cuentas."; return; }
  const btn = $("#sp-save"); if (btn) btn.disabled = true;
  try {
    if (nuevas) await saveCfg("cuentas", { items: list });

    store.set("cj.split.gente", [...new Set(s.personas.filter(p => p !== YO).concat(store.get("cj.split.gente", [])))].slice(0, 20));
    split.hecho = true; splitSave();
    toast(s.pagador === YO ? "Apuntado: tu parte y lo que te deben" : "Apuntado: tu parte y lo que le debes"); renderView();
  } catch (e) { err.textContent = saveErr(e); if (btn) btn.disabled = false; }
}

let tcApi = null, tcBusy = false, tcErr = "", tcOpen = null;

const tcKeyOf = link => { const s = String(link || "").trim(); const m = s.match(/([A-Za-z0-9]{6,64})\/?(?:[?#].*)?$/); return m ? m[1] : ""; };
const tcMoney = (v, cur) => cur && cur !== "EUR" ? NF2.format(r2(v)) + " " + cur : eur(v);
function tcYo(it, d){
  if (it.yo && d.miembros.some(m => m.uuid === it.yo)) return it.yo;
  const j = d.miembros.filter(m => /^(juan|yo\b)/.test(norm(m.nombre)));   // «Juan», «Juanito», «Juan T.», «Yo»
  return j.length === 1 ? j[0].uuid : null;
}
// Para quedar en paz: el que más debe paga al que más le deben, y así hasta acabar
function tcSaldar(saldos){
  const deb = [], acr = [];
  for (const [u, v] of Object.entries(saldos)) { const c = Math.round(v * 100); if (c < 0) deb.push([u, -c]); else if (c > 0) acr.push([u, c]); }
  deb.sort((a, b) => b[1] - a[1]); acr.sort((a, b) => b[1] - a[1]);
  const out = [];
  let i = 0, j = 0;
  while (i < deb.length && j < acr.length) {
    const x = Math.min(deb[i][1], acr[j][1]);
    out.push({ de: deb[i][0], a: acr[j][0], v: x / 100 });
    deb[i][1] -= x; acr[j][1] -= x;
    if (!deb[i][1]) i++; if (!acr[j][1]) j++;
  }
  return out;
}
const hace = ts => { const m = Math.round((Date.now() - ts) / 6e4); return m < 1 ? "ahora mismo" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`; };

  if (!links.length) return;
  tcBusy = true; tcErr = ""; if (tab === "medias") renderView();
  let got = [];
  try {
    got = await tcApi.leer(links);
    for (const d of got) TC[d.key] = { ...d, at: Date.now() };

  } catch (e) {
    tcErr = e && e.code === "session_expired" ? "Tu sesión ha caducado: vuelve a entrar." : e && e.code === "rate_limited" ? "Tricount pide esperar un poco. Prueba en un rato." : "No he podido hablar con Tricount ahora mismo. Prueba en un rato.";

async function tcPasarStart(key){

  const rows = tcPendientes(it, d, yo).map(g => ({ id: String(g.id), fecha: g.fecha, concepto: String(g.concepto || "Gasto").slice(0, 120), parte: r2(g.reparto[yo]), total: g.total, pago: g.pago, cat: "", sel: !fuera.has(String(g.id)), aviso: fuera.has(String(g.id)) ? "Fuera: no es un gasto tuyo." : "", low: false }));

  for (const r of rows) {

    const m = MOVS.find(m => m.tipo === "gasto" && m.origen !== "tricount" && !used.has(m.id) && dd(m.fecha, r.fecha) <= 2 && (Math.abs(num(m.total) - r.total) < 0.01 || Math.abs(num(m.total) - r.parte) < 0.01));

    const parte = rows.slice(i * N, (i + 1) * N);
    try {
      const o = await sample.json(tcPasarPrompt(it, d, parte), { cache: false });
      for (const x of (o && o.g) || []) {
        const r = parte.find(r => r.id === String(x && x.id)); if (!r) continue;
        if (x.cat && CATIDX[x.cat] && CATIDX[x.cat].tipo === "gasto") r.cat = x.cat;
        r.low = !r.cat || num(x.confianza) < 0.6;

    }

  }
  TCP.busy = false; renderView();
}

// La cuenta «Tricount: …» con el saldo que dice Tricount hoy (sólo si cambia)
function tcCuentaAlDia(list, it, d, yo){
  const id = tcAccId(it.key), v = r2(d.saldos[yo] || 0), hoy = toISO(NOW);

  use("sample").then(async s => { sample = s; if (s) imgCaps = await s.limits().catch(() => null); if (!typing()) renderView(); });
  use("assets").then(a => { assets = a; });
  use("tricount").then(t => { tcApi = t; if (t && tab === "medias") renderView(); });
  use("drive").then(d => { driveApi = d; if (d && dbState === "ready") driveAuto(); if (d && tab === "dinero") renderView(); });
  db = await use("db");
  if (!db) { dbState = "none"; renderAll(); return; }
  const got = new Set();
  const fail = err => { if (err && (err.code === "revoked" || err.code === "not_granted" || err.code === "capability_disabled")) { dbState = "none"; db = null; renderAll(); } };
  const ready = k => { got.add(k); if (got.size === 3) dbState = "ready"; onData(); };
  db.collection("movs").onSnapshot(snap => { meses = {}; for (const d of snap.docs) meses[d.id] = d.data(); rebuild(); movsReady = true; ready("movs"); }, fail);
  db.collection("config").onSnapshot(snap => {
    cfg = { cuentas: null, cats: null, prefs: {}, tricount: [] };
    for (const d of snap.docs) { const v = d.data() || {}; if (d.id === "cuentas") cfg.cuentas = v.items || []; else if (d.id === "categorias" && v.gasto && v.ingreso) cfg.cats = v; else if (d.id === "prefs") cfg.prefs = v; else if (d.id === "tricount") cfg.tricount = v.items || []; }
    buildCatIdx(); ready("config");
  }, fail);
  db.collection("anios").onSnapshot(snap => { anios = {}; for (const d of snap.docs) anios[d.id] = d.data(); ready("anios"); }, fail);
})();
})();
</script>
