name: Publicar web del gimnasio

# Genera la web (gym-app/build-web.sh) y la sube a la rama gh-pages, que es la que
# publica GitHub Pages en https://juatorcan1.github.io/juan-torres-candau/.
# gh-pages solo contiene la web generada: se reescribe entera en cada publicación.
on:
  push:
    branches: [main]
    paths: ["gym-app/**", ".github/workflows/gym-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gym-web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la web
        run: gym-app/build-web.sh
      - name: Subir a gh-pages
        working-directory: gym-app/web
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web del gimnasio desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
