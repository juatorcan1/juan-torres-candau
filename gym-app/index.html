<title>Juan vs Ignacio</title>
<meta name="description" content="Entrenos, pesos, copas y dieta de Juan e Ignacio con comparativa en directo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F5F6F3; --line:#D9DDD6; --line-2:#E6E9E3;
  --ink:#15191C; --ink-2:#434B52; --muted:#6B737A;
  --juan:#2F5BD3; --ign:#E0662A;
  --juan-strong:#2A52C0; --ign-strong:#B24A15;
  --juan-wash:rgba(47,91,211,.10); --ign-wash:rgba(224,102,42,.12);
  --good:#1D7F46; --bad:#B8362B; --focus:#2F5BD3;
  --me:var(--ink); --me-strong:var(--ink);
  --fig:#1F2428; --fig-far:#A9B0B6; --muscle:#D0425C; --prop:#59636C; --prop-2:#C9CFC8;
  --ok:#1D7F46; --warn:#A86A00; --over:#B8362B; --ok-bg:rgba(29,127,70,.10); --warn-bg:rgba(168,106,0,.12); --over-bg:rgba(184,54,43,.10);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111315; --surface:#1A1D1F; --surface-2:#212427; --line:#30353A; --line-2:#272B2F;
    --ink:#ECEEEF; --ink-2:#B7BDC2; --muted:#8C949B;
    --juan:#5B82F0; --ign:#D9622A;
    --juan-strong:#3D66DB; --ign-strong:#B9521F;
    --juan-wash:rgba(91,130,240,.16); --ign-wash:rgba(217,98,42,.18);
    --good:#48B77A; --bad:#E0685C; --focus:#7C9BFF;
    --fig:#E4E7E9; --fig-far:#5C646B; --muscle:#EA6C83; --prop:#9AA3AB; --prop-2:#3A4046;
    --ok:#48B77A; --warn:#E0A53A; --over:#E0685C; --ok-bg:rgba(72,183,122,.14); --warn-bg:rgba(224,165,58,.14); --over-bg:rgba(224,104,92,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111315; --surface:#1A1D1F; --surface-2:#212427; --line:#30353A; --line-2:#272B2F;
  --ink:#ECEEEF; --ink-2:#B7BDC2; --muted:#8C949B;
  --juan:#5B82F0; --ign:#D9622A;
  --juan-strong:#3D66DB; --ign-strong:#B9521F;
  --juan-wash:rgba(91,130,240,.16); --ign-wash:rgba(217,98,42,.18);
  --good:#48B77A; --bad:#E0685C; --focus:#7C9BFF;
    --fig:#E4E7E9; --fig-far:#5C646B; --muscle:#EA6C83; --prop:#9AA3AB; --prop-2:#3A4046;
    --ok:#48B77A; --warn:#E0A53A; --over:#E0685C; --ok-bg:rgba(72,183,122,.14); --warn-bg:rgba(224,165,58,.14); --over-bg:rgba(224,104,92,.14);
}
body.me-juan{--me:var(--juan);--me-strong:var(--juan-strong)}
body.me-ignacio{--me:var(--ign);--me-strong:var(--ign-strong)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding-block:0 72px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.dot.juan{background:var(--juan)} .dot.ignacio{background:var(--ign)}

/* brand row */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand h1 .vs{color:var(--muted);font-weight:600;margin-inline:.25em}
.whoami{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* sticky strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding-block:10px 8px;max-width:1000px;margin:0 auto}
.side{min-width:0}
.side.right{text-align:right}
.side .nm{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1;display:inline-flex;align-items:center;gap:6px;padding-bottom:4px;border-bottom:4px solid}
.side.juan .nm{border-color:var(--juan)} .side.ignacio .nm{border-color:var(--ign)}
.side .you{font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.08em;background:var(--ink);color:var(--bg);border-radius:3px;padding:1px 5px}
.side .st{margin-top:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{text-align:center;display:grid;justify-items:center;gap:3px}
.mid .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mid .big .sep{color:var(--muted);margin-inline:.12em}
.mid .cap{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mid select{font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.tabs{display:flex;gap:2px;max-width:1000px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:9px 10px 8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--me)}
.tabs button:hover{color:var(--ink)}

main{padding-top:18px;display:grid;gap:18px;min-width:0}
main > section, main > section > div, .panel, .grid2 > *, .pique{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:18px}
.panel h2{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}

.banner{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.banner strong{color:var(--ink)}

/* pique */
.pique{display:grid;gap:4px;padding:16px 18px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2)}
.pique p{margin:0;font-size:19px;font-weight:600;line-height:1.3;max-width:60ch}
.pique .sub{font-size:14px;font-weight:500;color:var(--ink-2)}

/* head to head */
.h2h{display:grid;gap:12px}
.h2h-row{display:grid;grid-template-columns:minmax(64px,auto) 1fr minmax(64px,auto);align-items:center;gap:10px}
.h2h-row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);white-space:nowrap}
.h2h-row .v.l{text-align:right} .h2h-row .v.win{color:var(--ink);font-weight:700}
.h2h-row .v.win::after{content:" ●";font-size:9px;vertical-align:2px}
.h2h-row .v.l.win::after{content:""} .h2h-row .v.l.win::before{content:"● ";font-size:9px;vertical-align:2px}
.h2h-mid{display:grid;gap:4px}
.h2h-mid .lbl{text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.h2h-mid .lbl span{color:var(--muted);font-weight:500}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:10px}
.bars .b{height:100%;background:var(--line-2);position:relative;overflow:hidden}
.bars .b.l{border-radius:4px 0 0 4px} .bars .b.r{border-radius:0 4px 4px 0}
.bars .b i{position:absolute;top:0;bottom:0;display:block}
.bars .b.l i{right:0;background:var(--juan);border-radius:4px 0 0 4px}
.bars .b.r i{left:0;background:var(--ign);border-radius:0 4px 4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* chart */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--me)}
#chart{position:relative;margin-top:8px}
#chart svg{display:block;width:100%;height:auto;overflow:visible}
#chart .axis{fill:var(--muted);font:11px var(--body)}
#chart .grid{stroke:var(--line-2);stroke-width:1}
#chart .base{stroke:var(--line);stroke-width:1}
#chart .val{fill:var(--ink-2);font:600 11px var(--mono)}
#chart .hit{fill:transparent;cursor:crosshair}
#chart .hit:hover,#chart .hit:focus{fill:var(--surface-2);outline:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:7px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tip b{font-weight:700}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.win{font-weight:700;color:var(--ink)}
td.win::after{content:" ●";font-size:9px;vertical-align:2px}
tr.grp td{background:var(--surface-2);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* feed / list */
.feed{display:grid}
.feed-item,.sess{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding-block:10px;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:0}
.feed-item .what{min-width:0}
.feed-item .what b{font-weight:600}
.feed-item .when{font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 18px}
.kv div{display:grid;gap:1px}
.kv dt{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.streaks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.streak{padding:12px;border-radius:8px;background:var(--surface-2)}
.streak .n{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.streak .l{font-size:12.5px;color:var(--ink-2)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px}
.day{margin-top:16px}
.day:first-child{margin-top:0}
.day h3{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.sess{grid-template-columns:auto 1fr auto;cursor:pointer}
.sess:hover{background:var(--surface-2)}
.sess .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sess .top b{font-weight:700}
.sess .sum{font-size:13.5px;color:var(--ink-2)}
.sess .mins{font-family:var(--mono);font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.sess-detail{grid-column:1/-1;display:grid;gap:12px;padding:6px 0 4px;cursor:default}
.sess-detail .notes{font-size:14px;color:var(--ink-2);white-space:pre-wrap;margin:0}
.ex-block h4{margin:0 0 4px;font-size:14px}
.ex-block h4 span{font-weight:500;color:var(--muted);font-size:12.5px}
.ex-block table{font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--me-strong);border-color:var(--me-strong);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{opacity:.55;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

/* who */
.who{display:grid;gap:14px;padding:26px 20px;text-align:center}
.who h2{font-family:var(--display);font-size:30px}
.who .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto;width:100%}
.who button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:22px 10px;font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.who button.juan:hover,.who button.juan:focus-visible{border-color:var(--juan);background:var(--juan-wash)}
.who button.ignacio:hover,.who button.ignacio:focus-visible{border-color:var(--ign);background:var(--ign-wash)}

/* form */
form{display:grid;gap:18px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;padding:0;margin-bottom:10px}
.sports{display:flex;gap:8px;flex-wrap:wrap}
.sports button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.sports button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.f label small{font-weight:500;color:var(--muted)}
.f input,.f select,.f textarea,.setrow input,.ex-head input,.ex-head select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:15px}
.f textarea{min-height:74px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.setrow input:focus,.ex-head input:focus,.ex-head select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.f.wide{grid-column:1/-1}
.live{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.live b{font-family:var(--mono);color:var(--ink)}
.ex{border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.ex-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ex-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px}
.ex-hint{font-size:12.5px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.ex-hint:empty{display:none}
.sets{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:22px repeat(4,minmax(0,1fr)) 44px 30px;gap:6px;align-items:center}
.setrow.hd{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.setrow.hd span{text-align:center}
.setrow .i{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:center}
.setrow input{padding:7px 6px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.setrow .wu{display:flex;justify-content:center}
.setrow .wu input{width:18px;height:18px;accent-color:var(--me)}
.setrow.warm input[type="number"],.setrow.warm input[inputmode]{background:var(--surface-2);color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;border-radius:5px;padding:4px}
.x:hover{color:var(--bad);background:var(--surface-2)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.form-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);margin-inline:-18px;padding-inline:18px;border-radius:0 0 10px 10px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.empty{padding:22px 0;text-align:center;color:var(--muted)}

@media (max-width:520px){
  .side .nm{font-size:clamp(16px,5vw,20px);max-width:100%}
  .side .you{display:none}
  .mid .big{font-size:32px}
  .side .st{font-size:11.5px}
  .panel{padding:14px}
  .form-foot{margin-inline:-14px;padding-inline:14px}
  .setrow{grid-template-columns:18px repeat(4,minmax(0,1fr)) 30px 26px;gap:4px}
  .setrow input{padding:7px 2px;font-size:14px}
  .h2h-row{grid-template-columns:minmax(52px,auto) 1fr minmax(52px,auto);gap:6px}
  .h2h-row .v{font-size:12.5px}
}
@media (prefers-reduced-motion:no-preference){
  .bars .b i{transition:width .35s ease}
}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.over{color:var(--over);background:var(--over-bg)}
.pill.neutral{color:var(--ink-2);background:var(--surface-2)}

/* ---------- mode toggle ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.modes button{border:0;background:none;padding:11px 10px;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--me)}

/* ---------- voice ---------- */
.voice{display:grid;gap:14px}
.voice textarea{width:100%;min-height:150px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:17px;line-height:1.45}
.voice textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.mic-help{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:14px;color:var(--ink-2)}
.mic-help svg{width:34px;height:34px;flex:none}
.mic-help b{color:var(--ink)}
.examples{display:flex;gap:8px;flex-wrap:wrap}
.examples button{border:1px dashed var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink-2);cursor:pointer;text-align:left}
.examples button:hover{border-style:solid;color:var(--ink)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-weight:600}

<script>
(function(){
"use strict";

/* ===== 01-core.js ===== */
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const nf = {};
const fmt = (v, dec = 0) => { const k = dec; nf[k] ||= new Intl.NumberFormat("es-ES", {maximumFractionDigits: dec, minimumFractionDigits: 0, useGrouping: true}); return nf[k].format(v || 0); };
const fmtBig = v => v >= 10000 ? fmt(v / 1000, 1) + " k" : fmt(v);
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const shortDate = d => `${d.getDate()} ${MES[d.getMonth()]}`;
const mmss = mins => { if (!isFinite(mins) || mins <= 0) return "–"; const t = Math.round(mins * 60); return `${Math.floor(t / 60)}:${pad(t % 60)}`; };
function relDay(iso){
  const diff = Math.round((today() - parseISO(iso)) / 864e5);
  if (diff === 0) return "hoy"; if (diff === 1) return "ayer"; if (diff > 1 && diff < 7) return `hace ${diff} días`;
  return shortDate(parseISO(iso));
}

/* ---------- domain ---------- */
// WEB = the standalone site (Supabase login); otherwise the Claude Artifact.
const WEB = !!window.GYM_WEB;
const ATH = { juan: "Juan", ignacio: "Ignacio" };
const KEYS = ["juan", "ignacio"];
const OTHER = { juan: "ignacio", ignacio: "juan" };
const SPORTS = { gym: "Gimnasio", bici: "Bicicleta", natacion: "Natación", cinta: "Cinta", otro: "Otro" };
const GROUPS = ["Pecho","Espalda","Piernas","Glúteo","Hombro","Bíceps","Tríceps","Core","Full body","Otro"];
const EQUIP = ["Barra","Mancuernas","Máquina","Polea","Peso corporal","Kettlebell","Otro"];
const CATALOG = {
  "Press banca":"Pecho","Press inclinado con mancuernas":"Pecho","Press en máquina":"Pecho","Aperturas":"Pecho","Cruce de poleas":"Pecho","Fondos":"Pecho",
  "Dominadas":"Espalda","Jalón al pecho":"Espalda","Remo con barra":"Espalda","Remo con mancuerna":"Espalda","Remo en polea baja":"Espalda","Peso muerto":"Espalda",
  "Sentadilla":"Piernas","Sentadilla búlgara":"Piernas","Prensa":"Piernas","Zancadas":"Piernas","Extensión de cuádriceps":"Piernas","Curl femoral":"Piernas","Gemelos":"Piernas",
  "Hip thrust":"Glúteo","Peso muerto rumano":"Glúteo",
  "Press militar":"Hombro","Elevaciones laterales":"Hombro","Pájaros":"Hombro","Face pull":"Hombro",
  "Curl con barra":"Bíceps","Curl martillo":"Bíceps","Curl en banco Scott":"Bíceps",
  "Extensión en polea":"Tríceps","Press francés":"Tríceps",
  "Plancha":"Core","Crunch":"Core","Rueda abdominal":"Core","Elevación de piernas":"Core"
};
const normName = s => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function gymStats(s){
  let vol = 0, sets = 0, reps = 0;
  for (const ex of s.exercises || []) for (const st of ex.sets || []) {
    if (st.warmup) continue; const r = num(st.reps); if (!r) continue;
    sets++; reps += r; vol += r * num(st.kg);
  }
  return { vol, sets, reps };
}
const e1rm = (kg, reps) => reps >= 1 && reps <= 12 ? kg * (1 + reps / 30) : 0;

function totals(list){
  const t = { sesiones: 0, minutos: 0, dias: new Set(), volumen: 0, series: 0, reps: 0, kmBici: 0, kmCinta: 0, mNado: 0, kcal: 0 };
  for (const s of list) {
    t.sesiones++; t.minutos += num(s.minutes); t.dias.add(s.date); t.kcal += num(s.kcal);
    if (s.sport === "gym") { const g = gymStats(s); t.volumen += g.vol; t.series += g.sets; t.reps += g.reps; }
    if (s.sport === "bici") t.kmBici += num(s.km);
    if (s.sport === "cinta") t.kmCinta += num(s.km);
    if (s.sport === "natacion") t.mNado += num(s.meters);
  }
  t.dias = t.dias.size;
  return t;
}
const METRICS = [
  { k: "sesiones", label: "Sesiones" },
  { k: "minutos", label: "Minutos entrenados", unit: "min" },
  { k: "dias", label: "Días activos" },
  { k: "volumen", label: "Volumen levantado", unit: "kg", big: true },
  { k: "series", label: "Series efectivas" },
  { k: "reps", label: "Repeticiones" },
  { k: "kmBici", label: "Bicicleta", unit: "km", dec: 1 },
  { k: "kmCinta", label: "Cinta", unit: "km", dec: 1 },
  { k: "mNado", label: "Natación", unit: "m" },
  { k: "kcal", label: "Calorías quemadas", unit: "kcal" },
  { k: "ube", label: "Alcohol", unit: "UBE", dec: 1, low: true }
];
const canonicalName = n => { const k = normName(n); return Object.keys(CATALOG).find(c => normName(c) === k) || String(n || "").trim(); };
const PERIODS = { semana: "Esta semana", mes: "Este mes", "año": "Este año", todo: "Desde siempre" };
const PERIOD_IN = { semana: "esta semana", mes: "este mes", "año": "este año", todo: "en total" };
function periodRange(p){
  const t = today();
  if (p === "semana") { const s = mondayOf(t); return [toISO(s), toISO(addDays(s, 6))]; }
  if (p === "mes") return [toISO(new Date(t.getFullYear(), t.getMonth(), 1)), toISO(new Date(t.getFullYear(), t.getMonth() + 1, 0))];
  if (p === "año") return [`${t.getFullYear()}-01-01`, `${t.getFullYear()}-12-31`];
  return ["0000-01-01", "9999-12-31"];
}
function sessionSummary(s){
  const bits = [];
  if (s.sport === "gym") {
    const g = gymStats(s); const n = (s.exercises || []).length;
    bits.push(`${n} ejercicio${n === 1 ? "" : "s"}`, `${g.sets} series`, `${fmt(g.vol)} kg`);
  } else if (s.sport === "bici") {
    if (num(s.km)) bits.push(`${fmt(num(s.km), 1)} km`);
    if (num(s.km) && num(s.minutes)) bits.push(`${fmt(num(s.km) / (num(s.minutes) / 60), 1)} km/h`);
    if (num(s.watts)) bits.push(`${fmt(num(s.watts))} W`);
  } else if (s.sport === "natacion") {
    if (num(s.meters)) bits.push(`${fmt(num(s.meters))} m`);
    if (num(s.meters) && num(s.minutes)) bits.push(`${mmss(num(s.minutes) * 100 / num(s.meters))} /100 m`);
    if (s.style) bits.push(s.style);
  } else if (s.sport === "cinta") {
    if (num(s.km)) bits.push(`${fmt(num(s.km), 2)} km`);
    if (num(s.km) && num(s.minutes)) bits.push(`${mmss(num(s.minutes) / num(s.km))} min/km`);
    if (num(s.incline)) bits.push(`${fmt(num(s.incline), 1)} % incl.`);
  } else {
    if (s.activity) bits.push(s.activity);
    if (num(s.km)) bits.push(`${fmt(num(s.km), 1)} km`);
  }
  if (num(s.hrAvg)) bits.push(`${fmt(num(s.hrAvg))} ppm`);
  return bits.join(" · ");
}
function streak(list, who){
  const days = new Set(list.filter(s => s.athlete === who).map(s => s.date));
  let d = today(); if (!days.has(toISO(d))) d = addDays(d, -1);
  let n = 0; while (days.has(toISO(d))) { n++; d = addDays(d, -1); }
  return n;
}
function bestWeekMinutes(list, who){
  const w = {};
  for (const s of list) if (s.athlete === who) { const k = toISO(mondayOf(parseISO(s.date))); w[k] = (w[k] || 0) + num(s.minutes); }
  let best = 0, at = null; for (const k in w) if (w[k] > best) { best = w[k]; at = k; }
  return { best, at };
}

/* ---------- demo data (only shown while the database is empty) ---------- */
function makeDemo(){
  let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647, (seed - 1) / 2147483646);
  const out = []; const t = today(); let n = 0;
  const r25 = x => Math.round(x / 2.5) * 2.5;
  const base = {
    juan: { "Press banca": 80, "Remo con barra": 70, "Press militar": 50, "Curl con barra": 32.5, "Sentadilla": 100, "Peso muerto rumano": 90, "Prensa": 180, "Dominadas": 0 },
    ignacio: { "Press banca": 85, "Remo con barra": 65, "Press militar": 47.5, "Curl con barra": 35, "Sentadilla": 95, "Peso muerto rumano": 100, "Prensa": 170, "Dominadas": 0 }
  };
  const A = ["Press banca", "Remo con barra", "Press militar", "Curl con barra"];
  const B = ["Sentadilla", "Peso muerto rumano", "Prensa", "Dominadas"];
  const plan = { juan: { 0: "gymA", 1: "cinta", 3: "gymB", 5: "bici", 6: "natacion" }, ignacio: { 0: "natacion", 2: "gymA", 3: "cinta", 4: "gymB", 6: "bici" } };
  for (let back = 40; back >= 0; back--) {
    const d = addDays(t, -back), wd = (d.getDay() + 6) % 7, prog = 1 + (40 - back) / 40 * 0.06;
    for (const a of KEYS) {
      const kind = plan[a][wd]; if (!kind || rnd() < 0.18) continue;
      const s = { id: "demo-" + (n++), demo: true, athlete: a, date: toISO(d), time: a === "juan" ? "07:30" : "19:00", rpe: 6 + Math.round(rnd() * 3), kcal: 0 };
      if (kind.startsWith("gym")) {
        const list = kind === "gymA" ? A : B; s.sport = "gym"; s.minutes = 55 + Math.round(rnd() * 25);
        s.exercises = list.map(name => {
          const top = r25(base[a][name] * prog); const bw = top === 0;
          const sets = bw ? [] : [{ reps: 10, kg: r25(top * 0.5), warmup: true }];
          const k = 3 + (rnd() < 0.4 ? 1 : 0);
          for (let i = 0; i < k; i++) sets.push({ reps: bw ? 8 + Math.round(rnd() * 3) : 6 + Math.round(rnd() * 4), kg: top, rir: 1 + Math.round(rnd() * 2), rest: 120 });
          return { name, group: CATALOG[name], equip: bw ? "Peso corporal" : name === "Prensa" ? "Máquina" : "Barra", sets };
        });
        s.kcal = Math.round(s.minutes * 6.5);
      } else if (kind === "cinta") {
        s.sport = "cinta"; s.minutes = 25 + Math.round(rnd() * 20); s.incline = rnd() < .5 ? 1 : 3;
        s.km = +(s.minutes / (a === "juan" ? 5.6 : 5.9)).toFixed(2); s.hrAvg = 148 + Math.round(rnd() * 12); s.kcal = Math.round(s.minutes * 11);

const DAILY_LOW_RISK = 2;   // UBE/día en hombres (20 g)

function alcoholIn(drinkDocs, who, a, b){
  let ube = 0, kcal = 0, over = 0, binge = 0, days = 0;
  for (const d of drinkDocs) if (d.athlete === who && d.date >= a && d.date <= b) {
    const u = dayUbe(d.counts); if (!u && !dayKcal(d.counts)) continue;
    ube += u; kcal += dayKcal(d.counts); if (u) days++;

function lerpPose(a, b, u){

/* ---------- diet ----------
   Targets: Mifflin-St Jeor (hombre) × factor de actividad según los minutos entrenados
   en las últimas 4 semanas y el tipo de trabajo, ajustado por objetivo.
   Menus are written for 2.400 kcal; quantities in {braces} scale with the person's target. */
const GOALS = { perder: { l: "Perder grasa", adj: -450, prot: 2.0 }, mantener: { l: "Mantener", adj: 0, prot: 1.8 }, ganar: { l: "Ganar músculo", adj: 250, prot: 1.8 } };
const WORK = { oficina: { l: "Oficina", f: 0 }, mixto: { l: "Mixto (oficina y obra)", f: 0.07 }, obra: { l: "Obra / trabajo físico", f: 0.15 } };
const PROFILE_DEFAULT = { height: 178, age: 35, goal: "perder", work: "mixto", alcoholGoal: 7 };
const CIRCS = {
  bocadillo: { l: "Obra: bocadillo o tortitas", s: "Sin cocina: todo va en la mochila" },
  bar: { l: "Bar o restaurante", s: "Menú del día o de tapas" },
  oficina: { l: "Oficina con cocina", s: "Táper y microondas" }
};
const MEALS = [["desayuno", "Desayuno"], ["media", "Media mañana"], ["comida", "Comida"], ["merienda", "Merienda"], ["cena", "Cena"]];

function dietTargets(profile, weightKg, weeklyMin){
  const p = { ...PROFILE_DEFAULT, ...(profile || {}) };
  const kg = weightKg || 80;
  const bmr = 10 * kg + 6.25 * num(p.height) - 5 * num(p.age) + 5;
  const act = (weeklyMin < 90 ? 1.35 : weeklyMin < 180 ? 1.45 : weeklyMin < 300 ? 1.55 : 1.68) + (WORK[p.work] || WORK.mixto).f;
  const g = GOALS[p.goal] || GOALS.perder;
  const kcal = Math.round((bmr * act + g.adj) / 50) * 50;
  const prot = Math.round(g.prot * kg), fat = Math.round(0.9 * kg);
  const carbs = Math.max(80, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return { kcal, prot, fat, carbs, bmr: Math.round(bmr), act, tdee: Math.round(bmr * act), goal: g.l };
}
const scaleText = (t, f) => t.replace(/\{(\d+)\}/g, (_, n) => String(Math.max(5, Math.round(+n * f / 5) * 5)));

/* ---------- header / scoreboard ---------- */
function computeDuel(){
  const [a, b] = periodRange(period);
  const inP = data().filter(s => s.date >= a && s.date <= b);
  const T = { juan: totals(inP.filter(s => s.athlete === "juan")), ignacio: totals(inP.filter(s => s.athlete === "ignacio")) };
  const wins = { juan: 0, ignacio: 0 };
  for (const k of KEYS) { const al = alcoholIn(drk(), k, a, b); T[k].ube = al.ube; T[k].alKcal = al.kcal; }
  for (const m of METRICS) {
    const j = T.juan[m.k], i = T.ignacio[m.k]; if (j === i) continue;
    if (m.low ? j < i : j > i) wins.juan++; else wins.ignacio++;
  }
  return { T, wins, inP };
}

/* ---------- Duelo ---------- */
function piqueText(T){
  const pl = PERIOD_IN[period];
  const j = T.juan, i = T.ignacio;
  if (j.sesiones + i.sesiones === 0) return { main: `Nadie ha entrenado ${pl} todavía.`, sub: "El primero que registre una sesión se pone por delante." };
  const lead = j.minutos === i.minutos ? null : (j.minutos > i.minutos ? "juan" : "ignacio");
  const diff = Math.abs(j.minutos - i.minutos);
  let main;
  if (!lead) main = `Empate a minutos ${pl}. El próximo entreno decide.`;
  else if (!me) main = `${ATH[lead]} le saca ${fmt(diff)} min a ${ATH[OTHER[lead]]} ${pl}.`;
  else if (lead === me) main = `Le sacas ${fmt(diff)} min a ${ATH[OTHER[me]]} ${pl}. Que no te pille.`;
  else main = `${ATH[lead]} te saca ${fmt(diff)} min ${pl}. Toca moverse.`;
  const subs = [];
  const vj = j.volumen, vi = i.volumen;
  if (vj !== vi) {
    const vl = vj > vi ? "juan" : "ignacio", vd = Math.abs(vj - vi);
    subs.push(me ? (vl === me ? `Y has levantado ${fmt(vd)} kg más.` : `${ATH[vl]} ha levantado ${fmt(vd)} kg más que tú.`) : `${ATH[vl]} lleva ${fmt(vd)} kg más de volumen.`);
  }
  const cardio = x => x.kmBici + x.kmCinta + x.mNado / 1000;
  const cj = cardio(j), ci = cardio(i);
  if (Math.abs(cj - ci) >= 0.5) {
    const cl = cj > ci ? "juan" : "ignacio";
    subs.push(me ? (cl === me ? `En cardio vas ${fmt(Math.abs(cj - ci), 1)} km por delante.` : `En cardio ${ATH[cl]} te lleva ${fmt(Math.abs(cj - ci), 1)} km.`) : `En cardio ${ATH[cl]} lleva ${fmt(Math.abs(cj - ci), 1)} km más.`);
  }
  return { main, sub: subs.join(" ") };
}

          </div>
          <div class="tscroll" style="margin-top:14px"><table>
            <thead><tr><th></th><th class="n">Juan</th><th class="n">Ignacio</th></tr></thead>
            <tbody>

function bodyRows(){
  const r = k => { const w = latestWeight(wts(), k), old = latestWeight(wts(), k, toISO(addDays(today(), -28))); return { w, d: w && old ? w.kg - old.kg : null }; };
  const J = r("juan"), I = r("ignacio");
  const wk = periodRange("semana"), aj = alcoholIn(drk(), "juan", ...wk), ai = alcoholIn(drk(), "ignacio", ...wk);
  const dd = x => x == null ? "–" : (x > 0 ? "+" : "") + fmt(x, 1) + " kg";
  return `<tr><td>Peso actual</td><td class="n">${J.w ? fmt(J.w.kg, 1) + " kg" : "–"}</td><td class="n">${I.w ? fmt(I.w.kg, 1) + " kg" : "–"}</td></tr>
    <tr><td>Cambio en 4 semanas</td><td class="n">${dd(J.d)}</td><td class="n">${dd(I.d)}</td></tr>
    <tr><td>Alcohol esta semana</td><td class="n ${aj.ube < ai.ube ? "win" : ""}">${fmt(aj.ube, 1)} UBE</td><td class="n ${ai.ube < aj.ube ? "win" : ""}">${fmt(ai.ube, 1)} UBE</td></tr>`;
}
function demoBanner(kind = "s"){
  const demo = kind === "s" ? isDemo() : kind === "w" ? wDemo() : kind === "d" ? dDemo() : wDemo() && dDemo();
  if (!demo) return "";
  const [art, what, first] = kind === "s" ? ["Las", "sesiones", "primeras"] : kind === "w" ? ["Los", "pesajes", "primeros"] : kind === "d" ? ["Las", "copas", "primeras"] : ["Los", "pesajes y copas", "primeros"];
  const why = dbState === "none"
    ? (WEB ? "No hay conexión con la base de datos: revisa internet y recarga." : "Esta vista no está conectada a la base de datos, así que no se guardará nada. Ábrela desde su enlace de Claude.")
    : `Desaparecen en cuanto apuntéis vuestros ${first} ${what} reales.`;
  return `<div class="banner"><strong>Datos de ejemplo.</strong> ${art} ${what} que ves son ${art === "Las" ? "inventadas" : "inventados"} para enseñar cómo funciona. ${why}</div>`;
}

function niceScale(max){
  if (max <= 0) return { top: 4, step: 1 };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { top: Math.ceil(max / step) * step, step };
}
function roundTop(x, y, w, h, r){
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function renderChart(){
  const host = $("#chart"); if (!host) return;
  const cm = CHART_METRICS[chartMetric];
  const m0 = mondayOf(today()); const weeks = [];
  for (let i = 7; i >= 0; i--) weeks.push(addDays(m0, -7 * i));
  const rows = weeks.map(w => {
    const a = toISO(w), b = toISO(addDays(w, 6)), r = { w };
    for (const k of KEYS) r[k] = data().filter(s => s.athlete === k && s.date >= a && s.date <= b).reduce((acc, s) => acc + cm.get(s), 0);
    return r;
  });
  const W = Math.max(300, Math.round(host.clientWidth || 640)), H = 230, M = { l: 46, r: 8, t: 18, b: 28 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const max = Math.max(0, ...rows.flatMap(r => [r.juan, r.ignacio]));
  const { top, step } = niceScale(max);
  const y = v => M.t + ih - (v / top) * ih;
  const band = iw / rows.length, bw = Math.max(6, Math.min(22, (band - 12) / 2 - 1));
  const fv = v => cm.dec ? fmt(v, cm.dec) : fmtBig(v);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) {
    g += `<line class="${v === 0 ? "base" : "grid"}" x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    g += `<text class="axis" x="${M.l - 8}" y="${y(v) + 4}" text-anchor="end">${fv(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const cx = M.l + band * i + band / 2;
    const xj = cx - 1 - bw, xi = cx + 1;
    const hj = ih * r.juan / top, hi = ih * r.ignacio / top;
    g += `<path d="${roundTop(xj, y(r.juan), bw, hj, 4)}" fill="var(--juan)"/>`;
    g += `<path d="${roundTop(xi, y(r.ignacio), bw, hi, 4)}" fill="var(--ign)"/>`;
    const last = i === rows.length - 1, sparse = band < 48;
    if (last || !sparse || (rows.length - 1 - i) % 2 === 0) g += `<text class="axis" x="${cx}" y="${H - 8}" text-anchor="middle">${last ? (sparse ? "Hoy" : "Esta sem.") : shortDate(r.w)}</text>`;
    if (i === rows.length - 1) {
      if (r.juan) g += `<text class="val" x="${xj + bw / 2}" y="${y(r.juan) - 5}" text-anchor="middle">${fv(r.juan)}</text>`;
      if (r.ignacio) g += `<text class="val" x="${xi + bw / 2}" y="${y(r.ignacio) - 5}" text-anchor="middle">${fv(r.ignacio)}</text>`;
    }
  });
  let hits = "";
  rows.forEach((r, i) => { hits += `<rect class="hit" data-i="${i}" tabindex="0" x="${M.l + band * i}" y="${M.t}" width="${band}" height="${ih}" rx="4" aria-label="Semana del ${shortDate(r.w)}: Juan ${fv(r.juan)} ${cm.unit}, Ignacio ${fv(r.ignacio)} ${cm.unit}"/>`; });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${cm.label} por semana, Juan contra Ignacio">${hits}${g}</svg><div class="tip" hidden></div>`;
  const tip = host.querySelector(".tip");
  const show = el => {
    const i = +el.dataset.i, r = rows[i];
    const u = cm.unit ? " " + cm.unit : "";
    const d = r.juan - r.ignacio;
    tip.innerHTML = `<b>Semana del ${shortDate(r.w)}</b><br>Juan: ${fv(r.juan)}${u}<br>Ignacio: ${fv(r.ignacio)}${u}${d ? `<br>${d > 0 ? "Juan" : "Ignacio"} +${fv(Math.abs(d))}${u}` : ""}`;
    const scale = host.clientWidth / W;
    let left = (M.l + band * i + band / 2) * scale;
    left = Math.max(80, Math.min(host.clientWidth - 80, left));
    tip.style.left = left + "px"; tip.style.top = (M.t * scale + 4) + "px"; tip.hidden = false;
  };
  host.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("pointerenter", () => show(el));
    el.addEventListener("pointerdown", () => show(el));
    el.addEventListener("focus", () => show(el));
    el.addEventListener("pointerleave", () => tip.hidden = true);
    el.addEventListener("blur", () => tip.hidden = true);
  });
  $("#chart-table").innerHTML = `<table><thead><tr><th>Semana</th><th class="n">Juan</th><th class="n">Ignacio</th></tr></thead><tbody>${
    rows.map(r => `<tr><td>${shortDate(r.w)}</td><td class="n ${r.juan > r.ignacio ? "win" : ""}">${fv(r.juan)}</td><td class="n ${r.ignacio > r.juan ? "win" : ""}">${fv(r.ignacio)}</td></tr>`).join("")
  }</tbody></table>`;
}

  const days = Object.keys(byDay).sort().reverse();

function sessRow(s){
  const open = openSess.has(s.id);
  return `<div class="sess" data-sid="${esc(s.id)}" tabindex="0" aria-expanded="${open}">
    <span class="dot ${s.athlete}"></span>
    <div>
      <div class="top"><b>${ATH[s.athlete]}</b><span class="chip">${esc(SPORTS[s.sport] || "")}</span>${s.time ? `<span class="muted" style="font-size:13px">${esc(s.time)}</span>` : ""}</div>
      <div class="sum">${esc(sessionSummary(s)) || "&nbsp;"}</div>
    </div>
    <span class="mins">${fmt(num(s.minutes))} min</span>
    ${open ? sessDetail(s) : ""}
  </div>`;
}
function sessDetail(s){
  const kv = [];
  const add = (l, v) => { if (v !== "" && v != null && v !== 0 && v !== "0") kv.push(`<div><dt>${l}</dt><dd>${esc(v)}</dd></div>`); };
  add("Duración", num(s.minutes) ? fmt(num(s.minutes)) + " min" : "");
  add("Esfuerzo (RPE)", num(s.rpe) ? num(s.rpe) + " / 10" : "");
  add("Sensación", s.feeling || "");
  add("FC media", num(s.hrAvg) ? fmt(num(s.hrAvg)) + " ppm" : "");
  add("FC máxima", num(s.hrMax) ? fmt(num(s.hrMax)) + " ppm" : "");
  add("Calorías", num(s.kcal) ? fmt(num(s.kcal)) + " kcal" : "");
  add("Peso corporal", num(s.bodyWeight) ? fmt(num(s.bodyWeight), 1) + " kg" : "");
  if (s.sport === "bici") {
    add("Tipo", s.bikeType || ""); add("Distancia", num(s.km) ? fmt(num(s.km), 1) + " km" : "");
    add("Velocidad media", num(s.km) && num(s.minutes) ? fmt(num(s.km) / (num(s.minutes) / 60), 1) + " km/h" : "");
    add("Desnivel", num(s.elevation) ? fmt(num(s.elevation)) + " m" : ""); add("Potencia media", num(s.watts) ? fmt(num(s.watts)) + " W" : "");
    add("Cadencia", num(s.cadence) ? fmt(num(s.cadence)) + " rpm" : "");
  }
  if (s.sport === "natacion") {
    add("Distancia", num(s.meters) ? fmt(num(s.meters)) + " m" : ""); add("Piscina", num(s.poolLength) ? num(s.poolLength) + " m" : "");
    add("Largos", num(s.laps) ? fmt(num(s.laps)) : ""); add("Estilo", s.style || "");
    add("Ritmo", num(s.meters) && num(s.minutes) ? mmss(num(s.minutes) * 100 / num(s.meters)) + " /100 m" : "");
  }
  if (s.sport === "cinta") {
    add("Distancia", num(s.km) ? fmt(num(s.km), 2) + " km" : ""); add("Inclinación", num(s.incline) ? fmt(num(s.incline), 1) + " %" : "");
    add("Ritmo", num(s.km) && num(s.minutes) ? mmss(num(s.minutes) / num(s.km)) + " min/km" : "");

  if (s.sport === "gym") {
    const g = gymStats(s);
    add("Volumen", fmt(g.vol) + " kg"); add("Series efectivas", String(g.sets)); add("Repeticiones", String(g.reps));
  }
  const exs = s.sport === "gym" ? (s.exercises || []).map(ex => `

      ${ex.notes ? `<p class="notes">${esc(ex.notes)}</p>` : ""}

  return `<div class="sess-detail">
    ${kv.length ? `<dl class="kv" style="margin:0">${kv.join("")}</dl>` : ""}

}

/* ---------- Récords ---------- */
function renderRecords(){
  const L = data();
  const ex = {};
  for (const s of L) if (s.sport === "gym") for (const e of s.exercises || []) {
    const key = normName(e.name); if (!key) continue;
    const r = ex[key] ||= { name: e.name.trim(), group: e.group || CATALOG[e.name.trim()] || "Otro", juan: null, ignacio: null };
    for (const st of e.sets || []) {
      if (st.warmup) continue; const kg = num(st.kg), reps = num(st.reps); if (!reps) continue;
      const cur = r[s.athlete] ||= { kg: -1, reps: 0, e1: 0, maxReps: 0, date: s.date };
      if (kg > cur.kg || (kg === cur.kg && reps > cur.reps)) { cur.kg = kg; cur.reps = reps; cur.date = s.date; }
      cur.e1 = Math.max(cur.e1, e1rm(kg, reps)); cur.maxReps = Math.max(cur.maxReps, reps);
    }
  }
  const byGroup = {};
  for (const r of Object.values(ex)) (byGroup[r.group] ||= []).push(r);
  const groups = Object.keys(byGroup).sort((a, b) => (GROUPS.indexOf(a) + 99 * (GROUPS.indexOf(a) < 0)) - (GROUPS.indexOf(b) + 99 * (GROUPS.indexOf(b) < 0)));
  const cell = (a, b, pick, f) => {
    const va = a ? pick(a) : null, vb = b ? pick(b) : null;
    const w = va != null && vb != null && va !== vb ? (va > vb ? "a" : "b") : null;
    return [`<td class="n ${w === "a" ? "win" : ""}">${va == null ? "–" : f(a)}</td>`, `<td class="n ${w === "b" ? "win" : ""}">${vb == null ? "–" : f(b)}</td>`];
  };
  let strength = "";
  for (const gname of groups) {
    strength += `<tr class="grp"><td colspan="7">${esc(gname)}</td></tr>`;
    for (const r of byGroup[gname].sort((a, b) => a.name.localeCompare(b.name, "es"))) {
      const [bj, bi] = cell(r.juan, r.ignacio, x => x.kg * 1000 + x.reps, x => x.kg > 0 ? `${fmt(x.kg, 2)} kg × ${x.reps}` : `${x.reps} reps`);
      const [ej, ei] = cell(r.juan, r.ignacio, x => x.e1 || null, x => x.e1 ? fmt(x.e1, 1) : "–");
      const [rj, ri] = cell(r.juan, r.ignacio, x => x.maxReps, x => fmt(x.maxReps));
      strength += `<tr><td>${esc(r.name)}</td>${bj}${bi}${ej}${ei}${rj}${ri}</tr>`;
    }
  }
  const best = (who, sport, val, filt = () => true, low = false) => {
    let b = null;
    for (const s of L) if (s.athlete === who && s.sport === sport && filt(s)) { const v = val(s); if (v > 0 && (b == null || (low ? v < b : v > b))) b = v; }
    return b;
  };
  const cardio = [
    { l: "Salida en bici más larga", f: w => best(w, "bici", s => num(s.km)), fm: v => fmt(v, 1) + " km" },
    { l: "Mayor velocidad media en bici", note: "desde 5 km", f: w => best(w, "bici", s => num(s.km) / (num(s.minutes) / 60), s => num(s.km) >= 5 && num(s.minutes) > 0), fm: v => fmt(v, 1) + " km/h" },
    { l: "Mayor potencia media en bici", f: w => best(w, "bici", s => num(s.watts)), fm: v => fmt(v) + " W" },
    { l: "Nado más largo", f: w => best(w, "natacion", s => num(s.meters)), fm: v => fmt(v) + " m" },
    { l: "Mejor ritmo nadando", note: "desde 200 m", low: true, f: w => best(w, "natacion", s => num(s.minutes) * 100 / num(s.meters), s => num(s.meters) >= 200 && num(s.minutes) > 0, true), fm: v => mmss(v) + " /100 m" },
    { l: "Carrera en cinta más larga", f: w => best(w, "cinta", s => num(s.km)), fm: v => fmt(v, 2) + " km" },
    { l: "Mejor ritmo en cinta", note: "desde 1 km", low: true, f: w => best(w, "cinta", s => num(s.minutes) / num(s.km), s => num(s.km) >= 1 && num(s.minutes) > 0, true), fm: v => mmss(v) + " min/km" },
    { l: "Sesión más larga", f: w => Math.max(0, ...L.filter(s => s.athlete === w).map(s => num(s.minutes))) || null, fm: v => fmt(v) + " min" },
    { l: "Más volumen en una sesión", f: w => Math.max(0, ...L.filter(s => s.athlete === w && s.sport === "gym").map(s => gymStats(s).vol)) || null, fm: v => fmt(v) + " kg" },
    { l: "Mejor semana", f: w => bestWeekMinutes(L, w).best || null, fm: v => fmt(v) + " min" }
  ];
  let wj = 0, wi = 0;
  const cardioRows = cardio.map(c => {
    const a = c.f("juan"), b = c.f("ignacio");
    let w = null; if (a != null && b != null && a !== b) w = (c.low ? a < b : a > b) ? "a" : "b";
    if (w === "a") wj++; if (w === "b") wi++;
    return `<tr><td>${c.l}${c.note ? ` <span class="muted">(${c.note})</span>` : ""}</td><td class="n ${w === "a" ? "win" : ""}">${a == null ? "–" : c.fm(a)}</td><td class="n ${w === "b" ? "win" : ""}">${b == null ? "–" : c.fm(b)}</td></tr>`;
  }).join("");
  $("#view-records").innerHTML = `
    <div style="display:grid;gap:18px">
      ${demoBanner()}
      <div class="panel">
        <div class="panel-head">
          <div><h2>Récords de fuerza</h2><div class="muted" style="font-size:13px;margin-top:2px">Mejor serie (más kilos), 1RM estimado (fórmula de Epley, series de hasta 12 reps) y máximo de repeticiones. Sin contar calentamiento. ● = va ganando.</div></div>
        </div>
        ${strength ? `<div class="tscroll"><table>
          <thead><tr><th rowspan="2">Ejercicio</th><th class="n" colspan="2">Mejor serie</th><th class="n" colspan="2">1RM est. (kg)</th><th class="n" colspan="2">Máx. reps</th></tr>
          <tr><th class="n">Juan</th><th class="n">Ignacio</th><th class="n">Juan</th><th class="n">Ignacio</th><th class="n">Juan</th><th class="n">Ignacio</th></tr></thead>
          <tbody>${strength}</tbody></table></div>` : `<div class="empty">Registrad sesiones de gimnasio para ver récords.</div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Récords de cardio y constancia</h2><div class="muted num" style="font-size:13px">Juan ${wj} – ${wi} Ignacio</div></div>
        <div class="tscroll"><table><thead><tr><th>Récord</th><th class="n">Juan</th><th class="n">Ignacio</th></tr></thead><tbody>${cardioRows}</tbody></table></div>
      </div>
    </div>`;
}

function updateLive(){

  } else if (d.sport === "bici") {

    t = "Apunta qué has hecho y cuánto tiempo.";

function bestFor(who, name){
  const key = normName(name); let b = null, last = null;
  for (const s of data()) if (s.athlete === who && s.sport === "gym" && s.id !== draft.id) for (const e of s.exercises || []) {
    if (normName(e.name) !== key) continue;
    const work = (e.sets || []).filter(x => !x.warmup && num(x.reps));
    if (work.length && (!last || s.date > last.date)) last = { date: s.date, sets: work };
    for (const st of work) if (!b || num(st.kg) > b.kg || (num(st.kg) === b.kg && num(st.reps) > b.reps)) b = { kg: num(st.kg), reps: num(st.reps) };
  }
  return { b, last };
}

/* ---------- figure animation ---------- */
const reduceMotion = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } })();
const figEls = new Map();
let figRaf = 0, figLast = 0;
const figIO = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => { const f = figEls.get(en.target); if (f) f.vis = en.isIntersecting; })) : null;
function figMarkup(name){
  return `<svg class="fig" viewBox="0 -14 200 206" data-fig="${esc(name)}" role="img" aria-label="Dibujo de ${esc(name)}: posición inicial y final">${figSVG(name, reduceMotion ? 1 : 0, true)}</svg>`;
}
function mountFigs(){
  document.querySelectorAll("svg[data-fig]").forEach(el => { if (!figEls.has(el)) { figEls.set(el, { name: el.dataset.fig, vis: true }); figIO?.observe(el); } });
  if (!reduceMotion && figEls.size && !figRaf) figRaf = requestAnimationFrame(figTick);
}
function figTick(ts){
  figRaf = 0;
  if (ts - figLast > 33) {
    figLast = ts;
    const ph = (ts % 2800) / 2800, tri = ph < .5 ? ph * 2 : 2 - ph * 2, c = Math.min(1, Math.max(0, (tri - .12) / .76)), u = c * c * (3 - 2 * c);
    for (const [el, f] of figEls) {
      if (!el.isConnected) { figEls.delete(el); figIO?.unobserve(el); continue; }
      if (f.vis) el.innerHTML = figSVG(f.name, u, true);
    }
  }
  if (figEls.size && !document.hidden) figRaf = requestAnimationFrame(figTick);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) mountFigs(); });

(async () => {
  const use = name => (window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
